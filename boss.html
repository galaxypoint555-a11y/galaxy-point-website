<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galaxy Point | Boss Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17253c;font:14px Segoe UI,Arial}.layout{display:flex;min-height:100vh}aside{width:240px;background:#17263b;color:white;padding:26px 18px}aside h2{margin:0 0 35px}aside a{display:block;color:#d9e5f9;padding:14px;text-decoration:none}main{flex:1;padding:30px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:25px 0}.card,.panel{background:white;border:1px solid #e2e8f2;border-radius:14px;padding:23px}.card b{font-size:27px;display:block;margin-top:9px}.muted{color:#738398}.panel{overflow:auto}table{width:100%;border-collapse:collapse;min-width:660px}td,th{text-align:left;border-bottom:1px solid #edf0f5;padding:13px}th{color:#77879a}button,input,select{padding:11px;border:1px solid #dce3ee;border-radius:8px;font:inherit}button{cursor:pointer;background:#235fe4;color:white;border:0}input{width:100%}.login{max-width:420px;margin:10vh auto}.login form{display:grid;gap:15px}.error{color:#ae3030}.status{color:#0b7753}#logout{background:#fff;color:#1c3357}.notice{background:#fff7e7;padding:15px;border-radius:9px;margin:15px 0}@media(max-width:850px){.layout{display:block}aside{width:100%;padding:15px}aside h2{margin:0 0 10px}main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="layout"><aside><h2>GP · Galaxy Point</h2><a href="index.html">Shopping Website ↗</a><a href="editor.html">Website Editor ↗</a></aside><main><header><div><h1>Boss Dashboard</h1><span class="muted">Sales and orders management</span></div><button id="logout" hidden>Sign out</button></header><p id="message" class="error"></p><div id="app"></div></main></div><script src="gp-config.js"></script><script src="gp-cloud.js"></script><script>(()=>{'use strict';const C=GPCloud,$=id=>document.getElementById(id),safe=C.clean;let orders=[];function login(){ $('app').innerHTML='<div class="panel login"><h2>Authorized Staff Login</h2><form id="login"><input type="email" name="email" placeholder="Email" required autocomplete="username"><input type="password" name="password" placeholder="Password" required autocomplete="current-password"><button>Sign In</button></form></div>';$('login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await C.signIn(f.get('email'),f.get('password'));await load()}catch(err){$('message').textContent=err.message}}}function show(){const paid=orders.filter(x=>x.payment_status==='paid'),revenue=paid.reduce((s,o)=>s+Number(o.total_inr||0),0),pending=paid.filter(x=>['new','pending','processing'].includes(x.status)).length;$('app').innerHTML='<div class="cards"><div class="card"><span class="muted">Verified Paid Orders</span><b>'+paid.length+'</b></div><div class="card"><span class="muted">Paid Revenue</span><b>'+C.money(revenue)+'</b></div><div class="card"><span class="muted">Orders to Process</span><b>'+pending+'</b></div><div class="card"><span class="muted">Completed Orders</span><b>'+paid.filter(x=>x.status==='completed').length+'</b></div></div><div class="panel"><h2>Paid Orders</h2><p class="muted">Only orders marked paid by the secure payment verification system are listed.</p><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Paid</th><th>Fulfilment</th></tr></thead><tbody>'+(paid.length?paid.map(o=>'<tr><td>'+safe(String(o.id).slice(0,8))+'</td><td>'+safe(o.customer_name||'Customer')+'</td><td>'+C.money(o.total_inr)+'</td><td>'+safe(new Date(o.created_at).toLocaleString('en-IN'))+'</td><td><select data-order="'+safe(o.id)+'">'+['new','processing','shipped','completed','cancelled'].map(x=>'<option value="'+x+'" '+(x===o.status?'selected':'')+'>'+x+'</option>').join('')+'</select></td></tr>').join(''):'<tr><td colspan="5" class="muted">No verified paid orders yet.</td></tr>')+'</tbody></table></div>';document.querySelectorAll('[data-order]').forEach(el=>el.onchange=async()=>{try{await C.updateOrderStatus(el.dataset.order,el.value);$('message').textContent='Order status saved';await load()}catch(err){$('message').textContent=err.message}})}async function load(){if(!C.configured()){$('app').innerHTML='<div class="notice">Supabase configuration is required. Set the public project URL and publishable key in gp-config.js.</div>';return}if(!C.active()){login();return}if(C.role!=='boss'&&C.role!=='admin'){$('app').innerHTML='<div class="notice">Boss or admin permission required.</div>';return}$('logout').hidden=false;try{orders=await C.orders();show()}catch(e){$('message').textContent=e.message}}$('logout').onclick=async()=>{await C.signOut();$('logout').hidden=true;load()};(async()=>{if(C.configured())try{await C.ensureSession()}catch(e){$('message').textContent=e.message}await load()})();setInterval(()=>{if(C.active()&&!document.hidden)load()},30000)})();</script></body></html>
