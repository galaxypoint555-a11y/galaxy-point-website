.gp-hero-video-placeholder{position:absolute;inset:0;background:radial-gradient(ellipse at 55% 40%,#3c3940 0%,#17171d 58%,#0b0d13 100%);z-index:1}.hero-video-layer video{display:block!important;opacity:0;transition:opacity .65s cubic-bezier(.22,1,.36,1);transform:scale(1.035);will-change:opacity,transform}.hero.video-ready .hero-video-layer video{opacity:1;animation:gpHeroCinematic 1.35s cubic-bezier(.2,.8,.2,1) both}@keyframes gpHeroCinematic{from{transform:scale(1.065);filter:brightness(.72)}to{transform:scale(1);filter:brightness(1)}}@media(prefers-reduced-motion:reduce){.hero-video-layer video{transition:none!important;animation:none!important;transform:none!important}}

/* Elegant video-loading presentation; hidden as soon as the first frame plays */
.gp-hero-video-placeholder{display:grid;place-items:center;background:linear-gradient(135deg,#191b26,#242a38 50%,#12141b);overflow:hidden}.gp-hero-video-placeholder:before{content:'';position:absolute;width:68vmin;height:68vmin;border-radius:50%;border:1px solid #ffffff0d;box-shadow:0 0 0 70px #ffffff04,0 0 0 140px #ffffff03;animation:gpVideoAmbient 5s ease-in-out infinite alternate}.gp-video-loading-brand{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;color:#e5e2dc;letter-spacing:.27em;font-size:13px;font-weight:650;text-shadow:0 2px 12px #0005}.gp-video-loading-monogram{display:grid;place-items:center;width:68px;height:68px;border:1px solid #ffffff48;border-radius:19px;font-size:24px;letter-spacing:0;font-weight:800;background:#ffffff0d}.gp-video-loading-brand small{font-size:9px;letter-spacing:.18em;color:#b7b9c4}.gp-video-loading-brand i{display:block;width:95px;height:2px;margin-top:8px;background:linear-gradient(90deg,transparent,#d8c6a8,transparent);animation:gpVideoPulse 1.4s ease-in-out infinite}.hero.video-ready .gp-hero-video-placeholder{opacity:0;transition:opacity .55s ease}@keyframes gpVideoPulse{50%{opacity:.2;transform:scaleX(.55)}}@keyframes gpVideoAmbient{to{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.gp-video-loading-brand i,.gp-hero-video-placeholder:before{animation:none}}

async function gpWishlistLead(id,contact,action){
 const p=items.find(x=>String(x.id)===String(id));if(!p)throw Error('Product unavailable');
 const cfg=window.GP_CONFIG;if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey)throw Error('Wishlist service unavailable');
 const base=cfg.supabaseUrl.replace(/\/$/,'');
 const res=await fetch(base+'/rest/v1/wishlist_leads',{method:'POST',headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({customer_name:contact.name,phone:contact.phone,product_id:String(p.id),product_name:p.name,action})});
 if(!res.ok){const detail=await res.json().catch(()=>({}));console.error('Galaxy Point wishlist save failed',res.status,detail);throw Error('Wishlist save failed ('+res.status+'): '+String(detail.message||detail.code||'Please try again').slice(0,160));}
}
async function gpRecordWebsiteLogin(contact){
 const cfg=window.GP_CONFIG||{};
 if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('Customer login service unavailable');
 const response=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/customer_login_events',{
  method:'POST',headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json',Prefer:'return=minimal'},
  body:JSON.stringify({customer_name:contact.name,phone:contact.phone,source:'website_login'})
 });
 if(!response.ok)throw Error('Unable to register website login ('+response.status+')');
}

function setupStoreVideo(){

 const path=(()=>{try{return new URL(source).pathname.toLowerCase()}catch(_){return source.toLowerCase()}})();
 if(!/\.m3u8$/.test(path)){v.src=source;v.load();play()}

 else{

 }

document.addEventListener("change",function(e){if(e.target.id==="gpReceiveMethod"){const delivery=e.target.value==="Delivery Enquiry",fields=document.getElementById("gpDeliveryFields");if(fields){fields.style.display=delivery?"grid":"none";fields.querySelectorAll("input").forEach(input=>{if(input.name!=="secondary_mobile"&&input.name!=="building"&&input.name!=="landmark")input.required=delivery;});}}});
document.addEventListener("submit",function(e){if(e.target.id==="checkoutForm"){e.preventDefault();const f=new FormData(e.target);const id="GP-DEMO-"+Math.floor(1000+Math.random()*9000);orders.push({id,name:String(f.get("name")).slice(0,70),total:sum()});bag={};page="track";show();document.getElementById("trackResult").innerHTML='<div class="callout"><strong>Demo order created:</strong> '+id+'<br>No real order was submitted. Enter the ID above to try order tracking.</div>'}else if(e.target.id==="trackForm"){e.preventDefault();const f=new FormData(e.target),id=String(f.get("id")).trim().toUpperCase(),o=orders.find(x=>x.id===id);document.getElementById("trackResult").innerHTML=o?'<div class="callout"><strong>'+o.id+'</strong><br>Status: Demo Pending<br>Amount: '+money(o.total)+'</div>':'<div class="callout">No matching demo order in this browser session.</div>'}});

try{const cached=localStorage.getItem('gp_cached_hero_video_url');if(cached&&/^https:\/\//i.test(cached)){window.gpPublishedSettings={...(window.gpPublishedSettings||{}),hero_video_url:cached};window.gpVideoSettingsLoaded=true}}catch(_e){}
show();

// Public catalog synchronization: reads only published active inventory.
// No customer credentials, staff permissions, or payment features are used.
async function gpLoadPublishedCatalog(){
 try{
  const cfg=window.GP_CONFIG;
  if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey){console.warn('Live catalog config missing');if(!window.gpCatalogSignature){items=[];show();}return;}
  const base=cfg.supabaseUrl.replace(/\/$/,'');
  const headers={apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey};
  const response=await fetch(base+'/rest/v1/products?select=id,title,brand,category,variant,description,price_inr,stock,image_url,is_published,active&is_published=eq.true&order=created_at.desc&limit=500',{headers,cache:'no-store'});
  if(!response.ok)throw Error('Catalog fetch failed: '+response.status);
  const rows=await response.json();
  if(!Array.isArray(rows))throw Error('Invalid catalog');
  // Display only real, published inventory from Supabase; never silently fall back to sample products.
  const meta=window.gpPublishedSettings?.product_metadata||{};const nextItems=rows.map((p,i)=>({id:p.id,condition:meta[String(p.id)]?.condition||'',gallery:meta[String(p.id)]?.gallery||[],productDescription:meta[String(p.id)]?.description||'',firstMedia:meta[String(p.id)]?.firstMedia||'photo',productVideo:meta[String(p.id)]?.productVideo||'',highlights:meta[String(p.id)]?.highlights||[],color:meta[String(p.id)]?.color||'',marketPrice:Number(meta[String(p.id)]?.marketPrice)||0,name:p.title,brand:p.brand||p.category,category:p.category,details:[p.variant,p.description].filter(Boolean).join(' • '),price:p.price_inr,stock:p.stock,image_url:p.image_url,photoIndex:i%6+1}));
  const nextSignature=JSON.stringify(nextItems);
  if(nextSignature!==window.gpCatalogSignature){window.gpCatalogSignature=nextSignature;items=nextItems;show();if(page==='home')gpRefreshFeaturedDeals();}
 }catch(err){console.warn('Galaxy Point catalog sync unavailable; hiding outdated sample products.',err);if(!window.gpCatalogSignature){items=[];show();}}
}
gpLoadPublishedCatalog();

function gpUpdateDropTimer(){const h=document.getElementById('gpDropHours');if(!h)return;const period=43200000,remaining=period-Date.now()%period;h.textContent=String(Math.floor(remaining/3600000)).padStart(2,'0');document.getElementById('gpDropMinutes').textContent=String(Math.floor(remaining%3600000/60000)).padStart(2,'0');document.getElementById('gpDropSeconds').textContent=String(Math.floor(remaining%60000/1000)).padStart(2,'0')}
setInterval(gpUpdateDropTimer,1000);
function gpRefreshFeaturedDeals(){if(page!=='home')return;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', [String.fromCharCode(39)]:'&#39;'}[c]));const daily=document.querySelector('.gp-deal-grid:not(.gp-price-grid)'),price=document.querySelector('.gp-price-grid');if(daily){const html=gpDailyDeals(esc);if(daily.innerHTML!==html)daily.innerHTML=html}if(price){const html=gpPriceDropProducts(esc);if(price.innerHTML!==html)price.innerHTML=html}}
async function gpLoadSiteSettings(){
 try{
  const cfg=window.GP_CONFIG;if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey)return;
  const base=cfg.supabaseUrl.replace(/\/$/,'');
  const response=await fetch(base+'/rest/v1/website_settings?select=key,value',{headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey},cache:'no-store'});
  if(!response.ok)throw Error('Settings unavailable: '+response.status);
  const settings=Object.fromEntries((await response.json()).map(x=>[x.key,x.value]));
  const settingsSignature=JSON.stringify(settings);
  const settingsChanged=settingsSignature!==window.gpSettingsSignature;
  window.gpSettingsSignature=settingsSignature;
  window.gpPublishedSettings=settings;
  // Apply featured sections as soon as settings arrive, without waiting for another page render.
  if(page==='home')gpRefreshFeaturedDeals();
  try{if(typeof settings.hero_video_url==='string'&&/^https:\/\//i.test(settings.hero_video_url))localStorage.setItem('gp_cached_hero_video_url',settings.hero_video_url)}catch(_e){}
  if(settings.category_images&&typeof settings.category_images==='object'){
   for(const name of ['iPhone','Samsung','Laptops']){
    const url=settings.category_images[name];
    if(typeof url==='string'&&/^https:\/\//.test(url))categoryImages[name]=url;
   }
  }
  window.gpVideoSettingsLoaded=true;
  if(settingsChanged){if(page==='home'){window.gpRenderedHeroVideo=settings.hero_video_url;setupStoreVideo();gpRefreshFeaturedDeals()}else if(page==='product')show();}
  else if(page==='home'&&!window.gpInitialVideoReady){window.gpInitialVideoReady=true;setupStoreVideo();}
 }catch(err){console.warn('Galaxy Point site settings unavailable',err);window.gpVideoSettingsLoaded=true;if(page==='home'&&!window.gpInitialVideoReady){window.gpInitialVideoReady=true;show();}}
}
gpLoadSiteSettings();
// Fast cloud sync: refresh when customers return to the tab and while it stays open.
// Avoid refreshing during checkout to preserve in-progress form data.
let gpLastSync=Date.now();
async function gpRefreshLive(){
 if(document.hidden||page==='checkout'||page==='cart')return;
 if(Date.now()-gpLastSync<1800)return;
 gpLastSync=Date.now();
 await Promise.allSettled([gpLoadSiteSettings(),gpLoadPublishedCatalog()]);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)gpRefreshLive()});
window.addEventListener('focus',gpRefreshLive);
setInterval(gpRefreshLive,8000);

})();
