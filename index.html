(function(){

const gpPhotoPreloaded=new Set();
function gpWarmProductPhotos(){
 const images=[...document.querySelectorAll('img.gp-catalog-photo')];
 if(!images.length)return;
 const warm=img=>{const src=img.currentSrc||img.src;if(!src||gpPhotoPreloaded.has(src))return;gpPhotoPreloaded.add(src);const pre=new Image();pre.decoding='async';pre.src=src;};
 if(!('IntersectionObserver' in window)){images.slice(0,24).forEach(warm);return}
 const observer=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){warm(entry.target);observer.unobserve(entry.target)}}},{rootMargin:'1100px 0px',threshold:0});
 images.forEach((img,index)=>{if(index<12){img.loading='eager';img.fetchPriority=index<6?'high':'auto';warm(img)}else{img.loading='lazy';observer.observe(img)}});
}

async function gpRequireCartLogin(){
 const saved=JSON.parse(localStorage.getItem('gpCustomerSession')||'null');
 if(saved?.name&&saved?.phone)return saved;
 const contact=await gpWishContactModal('Continue to Order','Enter your name and mobile number to add items to your bag or place an order.');

 localStorage.setItem('gpCustomerSession',JSON.stringify(contact));
 gpRecordWebsiteLogin(contact).catch(()=>{});
 return contact;
}

function setupReveals(){const nodes=[...document.querySelectorAll(".reveal")];if(!("IntersectionObserver" in window)){nodes.forEach(n=>n.classList.add("in-view"));return}const observer=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("in-view");observer.unobserve(entry.target)}})},{threshold:.06,rootMargin:"0px 0px 25px 0px"});nodes.forEach(n=>observer.observe(n))}

function setupStoreVideo(){

 else if(d.add){const p=items.find(x=>String(x.id)===String(d.add));if(p){gpRequireCartLogin().then(c=>{if(!c)return;const key=window.GPVariants.key(p,true),entry=window.GPVariants.resolve(items,key);if(entry&&(bag[key]||0)<entry.stock){bag[key]=(bag[key]||0)+1;show()}})}}
 else if(d.bagPlus){const entry=window.GPVariants.resolve(items,d.bagPlus);if(entry&&(bag[d.bagPlus]||0)<entry.stock){bag[d.bagPlus]=(bag[d.bagPlus]||0)+1;show()}}
 else if(d.dec){bag[d.dec]=(bag[d.dec]||0)-1;if(bag[d.dec]<=0)delete bag[d.dec];show()}
 else if(d.like){const id=String(d.like);if(gpWishlist.has(id)){gpWishlist.delete(id);localStorage.setItem("gpWishlist",JSON.stringify([...gpWishlist]));t.textContent="♡";t.style.color=""}else{gpWishAdd(id).then(ok=>{if(ok){t.textContent="♥";t.style.color="#b94f52"}})}}
});

async function gpLoadPublishedCatalog(){
 try{
  const rows=(await window.GPCloud.listPublic('products')).filter(p=>p.is_published);
  const meta=window.gpPublishedSettings?.product_metadata||{};
  const nextItems=rows.map((p,i)=>({id:p.id,condition:meta[String(p.id)]?.condition||'',gallery:meta[String(p.id)]?.gallery||[],productDescription:meta[String(p.id)]?.description||'',stockCode:String(meta[String(p.id)]?.stockCode||''),withBox:!!meta[String(p.id)]?.withBox,firstMedia:meta[String(p.id)]?.firstMedia||'photo',productVideo:meta[String(p.id)]?.productVideo||'',highlights:meta[String(p.id)]?.highlights||[],color:meta[String(p.id)]?.color||'',marketPrice:Number(meta[String(p.id)]?.marketPrice)||0,conditionPrices:{bestValue:Number(meta[String(p.id)]?.conditionPrices?.bestValue)||0},colorImages:meta[String(p.id)]?.colorImages||{},colorVideos:meta[String(p.id)]?.colorVideos||{},officialWarranty:meta[String(p.id)]?.officialWarranty||'',variantOptions:Array.isArray(p.variant_options)?p.variant_options:[],name:p.title,brand:p.brand||p.category,category:p.category,details:(()=>{const unit=(Array.isArray(p.variant_options)?p.variant_options:[])[0]||{};const battery=String(unit.batteryHealth??unit.battery_health??'').trim();const rawRegion=String(unit.region??unit.market??'').trim();const region=/^indian?$/i.test(rawRegion)?'Indian':/^global$/i.test(rawRegion)?'Global':'';return [p.variant,/^(?:100|[1-9]?\d)(?:\.\d+)?$/.test(battery)?battery+'% Battery Health':'',region].filter(Boolean).join(' • ')})(),price:p.price_inr,stock:p.stock,image_url:p.image_url,photoIndex:i%6+1}));
  const nextSignature=JSON.stringify(nextItems);
  if(nextSignature!==window.gpCatalogSignature){window.gpCatalogSignature=nextSignature;items=nextItems;show();if(page==='home')gpRefreshFeaturedDeals();}
 }catch(err){console.warn('Galaxy Point catalog sync unavailable',err);if(!window.gpCatalogSignature){items=[];show();}}
}

function gpUpdateDropTimer(){const h=document.getElementById('gpDropHours');if(!h)return;const period=43200000,remaining=period-Date.now()%period;h.textContent=String(Math.floor(remaining/3600000)).padStart(2,'0');document.getElementById('gpDropMinutes').textContent=String(Math.floor(remaining%3600000/60000)).padStart(2,'0');document.getElementById('gpDropSeconds').textContent=String(Math.floor(remaining%60000/1000)).padStart(2,'0')}
setInterval(gpUpdateDropTimer,1000);
function gpRefreshFeaturedDeals(){if(page!=='home')return;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', [String.fromCharCode(39)]:'&#39;'}[c]));const daily=document.querySelector('.gp-deal-grid:not(.gp-price-grid)'),price=document.querySelector('.gp-price-grid');if(daily){const html=gpDailyDeals(esc);if(daily.innerHTML!==html)daily.innerHTML=html}if(price){const html=gpPriceDropProducts(esc);if(price.innerHTML!==html)price.innerHTML=html}}
async function gpLoadSiteSettings(){
 try{
  const settings=await window.GPCloud.settings();
  const settingsSignature=JSON.stringify(settings);
  const settingsChanged=settingsSignature!==window.gpSettingsSignature;
  window.gpSettingsSignature=settingsSignature;
  window.gpPublishedSettings=settings;
  if(page==='home')gpRefreshFeaturedDeals();
  if(settings.category_images&&typeof settings.category_images==='object'){
   for(const name of ['iPhone','Samsung','Laptops']){
    const url=settings.category_images[name];
    if(typeof url==='string'&&/^https:\/\//.test(url))categoryImages[name]=url;
   }
  }
  window.gpVideoSettingsLoaded=true;
  if(settingsChanged){if(page==='home'){setupStoreVideo();gpRefreshFeaturedDeals()}else if(page==='product')show();}
  else if(page==='home'&&!window.gpInitialVideoReady){window.gpInitialVideoReady=true;setupStoreVideo();}
 }catch(err){console.warn('Galaxy Point site settings unavailable',err);window.gpVideoSettingsLoaded=true;if(page==='home'&&!window.gpInitialVideoReady){window.gpInitialVideoReady=true;show();}}
}
gpLoadSiteSettings().then(gpLoadPublishedCatalog);
let gpLastSync=Date.now();
async function gpRefreshLive(){
 if(document.hidden||page==='checkout'||page==='cart')return;
 if(Date.now()-gpLastSync<2500)return;
 gpLastSync=Date.now();
 await gpLoadSiteSettings(); await gpLoadPublishedCatalog();
}
