function checkout(){if(!cartLines().length)return cart();if(!cfg.onlinePaymentsEnabled||!cfg.supabaseUrl||!cfg.supabaseAnonKey)return '<div class="container" style="padding:90px 0;text-align:center"><h1>Online checkout is not available yet</h1><p>Products can be browsed, but payments will only be accepted after secure gateway verification is activated.</p><a class="btn" href="#shop">BACK TO SHOP</a></div>';const c=state.checkout;c.payment_method='online';const onlineAvailable=cloud&&cfg.onlinePaymentsEnabled&&c.fulfillment==='pickup'; if(!onlineAvailable&&c.payment_method==='online')c.payment_method='pay_at_store';return `<div class="page-hero"><div class="container">${crumb('Checkout')}<h1>Secure checkout.</h1><p class="section-desc">Enter your contact details and choose how you'd like your order fulfilled.</p></div></div><div class="container checkout-layout"><form id="checkout-form" class="checkout-form"><span class="eyebrow">YOUR DETAILS</span><h2>Contact information</h2><div class="form-grid"><div class="form-field"><label for="buyer-name">Full name *</label><input id="buyer-name" name="name" value="${escapeHTML(c.name)}" maxlength="100" autocomplete="name" required placeholder="Your full name"></div><div class="form-field"><label for="buyer-phone">Mobile number *</label><input id="buyer-phone" name="phone" type="tel" pattern="[0-9+ ()-]{10,18}" value="${escapeHTML(c.phone)}" maxlength="18" autocomplete="tel" required placeholder="10-digit mobile number"></div></div><div class="form-field"><label for="buyer-email">Email (optional)</label><input id="buyer-email" name="email" type="email" maxlength="150" autocomplete="email" value="${escapeHTML(c.email)}" placeholder="For receipt / updates"></div>
 <h2>Delivery method</h2><div class="radio-cards"><label class="radio-card"><input type="radio" name="fulfillment" value="pickup" ${c.fulfillment==='pickup'?'checked':''}><span><b>Pick up from store</b><small>Galaxy Point, Tiara Mall, Kharghar</small></span></label><label class="radio-card"><input type="radio" name="fulfillment" value="delivery" ${c.fulfillment==='delivery'?'checked':''} ${cfg.deliveryEnabled?'':'disabled'}><span><b>Delivery request</b><small>Availability and shipping charge confirmed by staff</small></span></label></div>
 ${c.fulfillment==='delivery'?`<div class="form-field"><label for="delivery-address">Full delivery address *</label><textarea id="delivery-address" name="address" maxlength="700" required placeholder="House / building, road, locality, city, state, PIN code">${escapeHTML(c.address)}</textarea><small>${escapeHTML(cfg.deliveryMessage||'Delivery charges are quoted separately.')}</small></div>`:''}
 <h2>Payment method</h2><div class="radio-cards"><label class="radio-card"><input type="radio" name="payment_method" value="online" ${c.payment_method==='online'?'checked':''} ${onlineAvailable?'':'disabled'}><span><b>Pay online with Razorpay</b><small>${!cloud?'Not available in demo':!cfg.onlinePaymentsEnabled?'Awaiting merchant activation':c.fulfillment==='delivery'?'Pickup only until shipping is configured':'UPI · Cards · Net banking'}</small></span></label></div>
 <label style="display:flex;align-items:start;gap:9px;font-size:11px;color:#636e66;margin:22px 0"><input type="checkbox" name="accept" required style="margin-top:3px;accent-color:var(--green)"><span>I agree to the <a href="#policies" target="_blank" style="text-decoration:underline">store policies</a> and understand that availability and warranty must be confirmed for the specific device.</span></label>
 ${!cloud?'<div class="notice">This is a <strong>demo checkout</strong>. Submitting creates a test order in this browser only; Galaxy Point will not receive it.</div>':''}
 ${cloud?`<div class="turnstile-area"><label class="small">Checkout security check *</label><div id="gp-turnstile"></div>${!cfg.turnstileSiteKey?'<div class="form-error">Secure live checkout is not configured yet. Ask the store team to complete setup.</div>':''}</div>`:''}
 ${state.checkoutError?`<div class="form-error" role="alert">${escapeHTML(state.checkoutError)}</div>`:''}
 <button class="btn btn-block" type="submit" ${state.checkoutBusy?'disabled':''}>${state.checkoutBusy?'PROCESSING...':c.payment_method==='online'?'PROCEED TO ONLINE PAYMENT':'PLACE ORDER REQUEST'} ${icon('arrow')}</button></form>
 <aside><div class="summary-box">${orderSummary()}<div class="checkout-items">${cartLines().map(({product,qty})=>`<div class="checkout-item"><span>${escapeHTML(product.title)} × ${qty}</span><span>${money(product.price_inr*qty)}</span></div>`).join('')}</div><p class="summary-hint">${c.fulfillment==='pickup'?`Pickup: ${escapeHTML(cfg.pickupAddress||cfg.location)}`:escapeHTML(cfg.deliveryMessage||'Shipping charges may apply.')}</p><p class="summary-hint">Payments are handled by a trusted payment provider only when configured. Galaxy Point does not ask for card PINs.</p></div></aside></div>`;}
function confirmation(){const result=state.activeOrder;if(!result)return `<div class="container"><div class="empty"><h2>No recent checkout</h2><a class="btn" href="#shop">BACK TO SHOP</a></div></div>`;return `<div class="container confirmation"><div class="checkmark">${icon('check')}</div><span class="eyebrow">${cloud?'ORDER REQUEST RECEIVED':'DEMO ORDER CREATED'}</span><h1>${result.payment_status==='paid'?'Payment received.':'Thanks for your order request.'}</h1><p class="muted">${cloud?'Save your order number. Our team will confirm the order and pickup / delivery details.':'This is a browser-only test order. No order or payment was sent to Galaxy Point.'}</p><div class="order-number">${escapeHTML(result.order_number)}</div><p class="small muted">Payment: ${escapeHTML(paymentLabel(result.payment_status))} · Order status: ${escapeHTML(statusLabel(result.status))}</p><div><button class="btn" data-action="track-recent">TRACK THIS ORDER ${icon('arrow')}</button><a href="#shop" class="btn btn-outline">CONTINUE SHOPPING</a></div></div>`;}
function statusLabel(st){return String(st||'pending').replace(/_/g,' ').replace(/\b\w/g,a=>a.toUpperCase());}
function paymentLabel(st){return ({paid:'Paid',awaiting:'Awaiting payment',authorized:'Awaiting capture',not_paid:'To be paid',failed:'Payment failed',refunded:'Refunded'})[st]||statusLabel(st);}
function track(){const r=state.trackResult;const stages=['pending','confirmed','processing','completed'];let idx=stages.indexOf(r?.status);if(r?.status==='ready_for_pickup'||r?.status==='out_for_delivery')idx=2;if(r?.status==='awaiting_payment')idx=-1;return `<div class="page-hero"><div class="container">${crumb('Track an order')}<h1>Track your order.</h1><p class="section-desc">Look up the status with the order number and mobile number used at checkout.</p></div></div><div class="container"><div class="track-form"><span class="eyebrow">ORDER UPDATES</span><h2>Where's your order?</h2>${!cloud?'<div class="notice">Demo orders can only be tracked from the browser where they were created.</div>':''}<form id="track-form"><div class="form-field"><label for="track-number">Order number *</label><input name="number" id="track-number" value="${escapeHTML(state.activeOrder?.order_number||'')}" placeholder="e.g. GP-260101-AB12CD" required></div><div class="form-field"><label for="track-phone">Mobile number *</label><input name="phone" id="track-phone" type="tel" placeholder="Phone used at checkout" value="${escapeHTML(state.activeOrder?.customer_phone||'')}" required></div><button class="btn btn-block" type="submit">CHECK ORDER STATUS ${icon('arrow')}</button></form>${state.trackError?`<div class="form-error">${escapeHTML(state.trackError)}</div>`:''}
 ${r?`<div class="track-card"><span class="eyebrow">ORDER ${escapeHTML(r.order_number)}</span><h3 style="font-size:21px;margin:12px 0">${escapeHTML(statusLabel(r.status))}</h3>${r.status==='cancelled'||r.status==='expired'?`<div class="notice">This order is ${escapeHTML(r.status)}. Please contact our team if you need help.</div>`:`<div class="track-stepper">${stages.map((s,i)=>`<div class="track-step ${i<=idx?'done':''}"><span>${i<=idx?'✓':i+1}</span><label>${['Placed','Confirmed','Preparing','Completed'][i]}</label></div>`).join('')}</div>`}<dl><div><dt>Payment status</dt><dd>${escapeHTML(paymentLabel(r.payment_status))}</dd></div><div><dt>Items total</dt><dd>${money(r.total_inr||r.total||0)}</dd></div><div><dt>Fulfilment</dt><dd>${r.fulfillment==='pickup'?'Store pickup':'Delivery request'}</dd></div><div><dt>Placed on</dt><dd>${escapeHTML(new Date(r.created_at).toLocaleDateString('en-IN'))}</dd></div></dl>${r.items?.length?`<div style="font-size:11px;color:#67736c;margin-top:17px">${r.items.map(x=>`${escapeHTML(x.product_title)} × ${Number(x.qty)}`).join(' · ')}</div>`:''}</div>`:''}</div></div>`;}
function services(){return `<div class="page-hero"><div class="container">${crumb('Services')}<h1>Everything your device needs.</h1><p class="section-desc">At Galaxy Point, we help beyond the checkout.</p></div></div>${servicesSection()}<div class="container" style="padding-bottom:70px"><div class="cta-help"><div><h2>Visit Galaxy Point in Kharghar</h2><p>${escapeHTML(cfg.location||'Kharghar, Navi Mumbai')} · ${escapeHTML(cfg.storeHours||'')}</p></div><a class="btn" target="_blank" rel="noopener" href="${escapeHTML(storeWA('Hi Galaxy Point, I want to enquire about an exchange or repair.'))}">ENQUIRE NOW</a></div></div>`;}
function policies(){return `<div class="page-hero"><div class="container">${crumb('Store policies')}<h1>Store policies & FAQs</h1></div></div><div class="container policies"><div class="notice"><strong>Important:</strong> The policies below are a starting framework. Galaxy Point should confirm and publish its final shipping, cancellation, returns, warranty and privacy terms before accepting live payments.</div>
 <h2>Product availability and condition</h2><p>Listings are subject to stock confirmation. Pre-owned and open-box devices may vary by condition, accessories, battery health and warranty. The specific unit's details must be confirmed before your purchase.</p>
 <h2>Payments</h2><p>Pay-at-store orders are enquiries or reservations until accepted by our team. Online payments, if enabled, are securely handled through the configured payment gateway. Orders awaiting online payment may expire after 30 minutes.</p>
 <h2>Pickup & delivery</h2><p>In-store pickup is at Galaxy Point, Shop No. 49, Tiara Mall, Sector 13, Kharghar, Navi Mumbai. Delivery availability and any shipping fees must be confirmed with our team before dispatch. Tracking on this website refers to the order's status, not necessarily a courier's location.</p>
 <h2>Warranty, returns & cancellation</h2><p>Warranty applies only where explicitly stated for the specific device. Return, replacement and cancellation eligibility depend on the device and the final terms shared with the customer. Please contact Galaxy Point before buying if you require written confirmation.</p>
 <h2>Customer data & privacy</h2><p>For order processing, the store collects your name, mobile number, optional email and delivery address if needed. In production these details are stored in the shop's private database, accessible only to authorized staff and payment service providers as required. Do not share payment PINs or OTPs with anyone.</p>
 <h2>Questions?</h2><p>Contact us on <a style="text-decoration:underline" href="${escapeHTML(cfg.instagram||'#')}" target="_blank" rel="noopener">Instagram</a> or visit the store. These draft terms are not a substitute for finalized legal policies.</p></div>`;}
function modal(){if(!state.modal)return '';if(state.modal.type==='search')return `<div class="modal-wrap" data-backdrop="1"><div class="modal-box" role="dialog" aria-modal="true" aria-label="Search catalog"><button class="modal-close" data-action="close-modal" aria-label="Close">×</button><h2>Find your next device</h2><form id="global-search-form"><div class="form-field"><input name="search" autofocus placeholder="Search iPhone, Samsung, MacBook..." required></div><button class="btn btn-block" type="submit">SEARCH COLLECTION ${icon('search')}</button></form></div></div>`;if(state.modal.type==='product')return productModal(state.modal.product);if(state.modal.type==='order')return orderModal(state.modal.order);return '';}
function mobile(){return state.mobile?`<div class="mobile-sheet" data-backdrop="mobile"><nav class="gp-side-menu"><button class="sheet-close" data-action="menu" aria-label="Close menu">×</button><a href="#home">HOME</a><a href="#shop?category=iPhone">IPHONE <span>›</span></a><a href="#shop?category=Samsung">SAMSUNG <span>›</span></a><a href="#shop?category=Android">ANDROID <span>›</span></a><a href="#shop?category=Laptops">LAPTOPS <span>›</span></a><a href="#shop?category=Tablets">IPAD & TABLETS <span>›</span></a><a href="#shop?category=Accessories">ACCESSORIES <span>›</span></a><a href="#wishlist">WISHLIST</a><a href="#track">MY ORDERS</a><a href="#services">OUR STORE</a><a href="#policies">ABOUT US</a><a class="gp-side-admin" href="#admin">STAFF ADMIN</a></nav></div>`:'';}

function render(){const [path,params]=window.location.hash.replace(/^#/,'').split('?');let content;const page=path||'home';const [kind,slug]=page.split('/');
 if(kind==='home')content=home();else if(kind==='shop'){const cat=new URLSearchParams(params||'').get('category');if(cat&&CATEGORIES.includes(cat))state.filter=cat;content=shop();}else if(kind==='product')content=detail(decodeURIComponent(slug||''));else if(kind==='wishlist')content=`<section class="section"><div class="container"><div class="gp-inline-heading"><h1 class="gp-serif-title">My Wishlist</h1><a href="#shop">Shop all</a></div>${productGrid(visibleProducts().filter(p=>state.wish.includes(p.id)))}</div></section>`;else if(kind==='cart')content=cart();else if(kind==='checkout')content=checkout();else if(kind==='confirmation')content=confirmation();else if(kind==='track')content=track();else if(kind==='services')content=services();else if(kind==='policies')content=policies();else if(kind==='admin')content=admin();else content=home();
 app.innerHTML=header()+`<main>${content}</main>`+footer()+`<a class="gp-floating-chat" href="${escapeHTML(storeWA('Hello Galaxy Point, I want to enquire about a device.'))}" target="_blank" rel="noopener" aria-label="Chat with Galaxy Point">${icon('phone')} <span>Chat</span></a>`+modal()+mobile()+(state.toast?`<div class="toast" role="status">${escapeHTML(state.toast)}</div>`:'');document.title=(kind==='home'?'Galaxy Point | Premium Devices. Trusted Deals.':`${kind[0]?.toUpperCase()||'G'}${kind.slice(1)} | Galaxy Point`);if(kind==='checkout')initTurnstile();}
function showToast(msg){state.toast=msg;render();setTimeout(()=>{state.toast='';document.querySelector('.toast')?.remove();},2800);}
function go(hash){if(window.location.hash===hash){render();window.scrollTo({top:0,behavior:'smooth'});}else window.location.hash=hash;}
function addToCart(id,qty=1){const p=byId(id);if(!p||!p.active||p.stock<=0)return showToast('Sorry, this item is sold out.');const amount=Math.min(Number(p.stock),Number(state.cart[id]||0)+qty);if(amount===Number(state.cart[id]||0))return showToast('Maximum available quantity reached.');state.cart[id]=amount;persist();showToast(`${p.title} added to cart`);}
function updateQty(id,delta){const p=byId(id);if(!p)return;let next=Number(state.cart[id]||0)+delta;if(next<=0)delete state.cart[id];else state.cart[id]=Math.min(next,Number(p.stock));persist();render();}
function normalizeCart(){let changed=false;for(const [id,qty] of Object.entries(state.cart)){const p=byId(id);if(!p||p.active===false||Number(p.stock)<=0){delete state.cart[id];changed=true;}else if(qty>p.stock){state.cart[id]=p.stock;changed=true;}}if(changed)persist();}
function parseHash(){const raw=window.location.hash.replace(/^#/,'');const [path,params]=raw.split('?');if((path||'')==='shop'){const cat=new URLSearchParams(params||'').get('category');state.filter=CATEGORIES.includes(cat)?cat:'All';}state.mobile=false;state.modal=null;state.trackError='';render();window.scrollTo(0,0);if(path==='admin'&&cloud)initializeAdmin();}
function collectCheckoutInput(){document.querySelectorAll('#checkout-form [name]').forEach(input=>{if(input.type==='radio'){if(input.checked)state.checkout[input.name]=input.value;}else if(input.type!=='checkbox')state.checkout[input.name]=input.value;});}
function validateCheckout(){const c=state.checkout;if(c.name.trim().length<2||c.name.length>100)return 'Please enter your full name.';if(digits(c.phone).length!==10 && !(digits(c.phone).length===12&&digits(c.phone).startsWith('91')))return 'Please enter a valid Indian mobile number.';if(c.email&&(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)))return 'Please enter a valid email address.';if(c.fulfillment==='delivery'&&!cfg.deliveryEnabled)return 'Delivery requests are currently unavailable.';if(c.fulfillment==='delivery'&&c.address.trim().length<12)return 'Please enter a complete delivery address.';if(c.payment_method==='online'&&!(cloud&&cfg.onlinePaymentsEnabled&&c.fulfillment==='pickup'))return 'Online payment is not enabled for this order.';if(!cartLines().length)return 'Your cart is empty.';if(cartLines().some(({product,qty})=>qty>product.stock))return 'Some items are no longer in stock. Please update your cart.';if(cloud&&(!cfg.turnstileSiteKey||!state.turnstileToken))return 'Complete the checkout security check to place an order.';return '';}
function initTurnstile(){
 if(!cloud||!cfg.turnstileSiteKey)return;
 const box=document.getElementById('gp-turnstile');if(!box||box.dataset.ready)return;
 if(!window.turnstile){if(window.__gpTurnstileLoading)return;window.__gpTurnstileLoading=true;
   const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
   script.onload=()=>{window.__gpTurnstileLoading=false;initTurnstile();};
   script.onerror=()=>{window.__gpTurnstileLoading=false;state.checkoutError='Security check could not load. Please try again.';};
   document.head.appendChild(script);return;
 }
 state.turnstileToken='';box.dataset.ready='1';
 try{window.turnstile.render(box,{sitekey:cfg.turnstileSiteKey,theme:'light',callback:token=>{state.turnstileToken=token;},'expired-callback':()=>{state.turnstileToken='';},'error-callback':()=>{state.turnstileToken='';}});}
 catch(error){state.checkoutError='Security check could not start. Refresh and try again.';}
}
async function cloudCall(name,payload){const url=cfg.supabaseUrl.replace(/\/$/,'')+'/functions/v1/'+name;const headers={'Content-Type':'application/json','apikey':cfg.supabaseAnonKey,'Authorization':'Bearer '+cfg.supabaseAnonKey};const res=await fetch(url,{method:'POST',headers,body:JSON.stringify(payload)});const json=await res.json().catch(()=>({}));if(!res.ok)throw new Error(json.error||`Request failed (${res.status})`);return json;}
async function submitCheckout(){collectCheckoutInput();state.checkoutError=validateCheckout();if(state.checkoutError){render();document.querySelector('#checkout-form')?.scrollIntoView({behavior:'smooth'});return;}if(state.checkoutBusy)return;const challengeToken=state.turnstileToken;state.checkoutBusy=true;render();try{let result;if(cloud){const c=state.checkout;result=await cloudCall('create-checkout',{customer_name:c.name.trim(),customer_phone:digits(c.phone).slice(-10),customer_email:c.email.trim()||null,fulfillment:c.fulfillment,delivery_address:c.fulfillment==='delivery'?c.address.trim():null,payment_method:c.payment_method,turnstile_token:challengeToken,items:cartLines().map(({product,qty})=>({product_id:product.id,qty}))});state.turnstileToken='';if(c.payment_method==='online'){state.checkoutBusy=false;render();return await startRazorpay(result);}}else{const now=new Date();result={order_number:'GP-DEMO-'+rand(),customer_phone:digits(state.checkout.phone).slice(-10),status:'pending',payment_status:'not_paid',fulfillment:state.checkout.fulfillment,total_inr:subtotal(),created_at:now.toISOString(),items:cartLines().map(({product,qty})=>({product_title:product.title,qty})),customer_name:state.checkout.name,customer_email:state.checkout.email,delivery_address:state.checkout.address,payment_method:'pay_at_store'};state.orders.unshift({...result});state.products.forEach(p=>{if(state.cart[p.id])p.stock=Math.max(0,p.stock-state.cart[p.id]);});}state.activeOrder=result;state.cart={};state.checkoutBusy=false;persist();go('#confirmation');}catch(err){state.checkoutBusy=false;state.checkoutError=String(err.message||err);render();}}
function loadScript(src){return new Promise((resolve,reject)=>{if(window.Razorpay)return resolve();const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(new Error('Payment provider could not be loaded.'));document.head.appendChild(script);});}
async function startRazorpay(order){try{await loadScript('https://checkout.razorpay.com/v1/checkout.js');const checkout=new window.Razorpay({key:order.key_id,amount:order.amount_paise,currency:'INR',name:'Galaxy Point',description:'Device order '+order.order_number,order_id:order.razorpay_order_id,prefill:{name:state.checkout.name,email:state.checkout.email,contact:digits(state.checkout.phone).slice(-10)},theme:{color:'#235747'},handler:async response=>{state.checkoutBusy=true;render();try{const verified=await cloudCall('verify-payment',{order_number:order.order_number,tracking_token:order.tracking_token,razorpay_order_id:response.razorpay_order_id,razorpay_payment_id:response.razorpay_payment_id,razorpay_signature:response.razorpay_signature});state.activeOrder={...verified,order_number:order.order_number,customer_phone:digits(state.checkout.phone).slice(-10),fulfillment:state.checkout.fulfillment};state.cart={};persist();go('#confirmation');}catch(error){state.checkoutError='Payment verification requires attention: '+String(error.message||error)+'. Keep your order number '+order.order_number+' and contact the store if money was deducted.';go('#checkout');}finally{state.checkoutBusy=false;render();}}});checkout.on('payment.failed',function(){state.checkoutError='Payment did not complete. Your reference is '+order.order_number+'. Please retry or contact the store.';go('#checkout');});checkout.open();}catch(err){state.checkoutError=String(err.message||err);go('#checkout');}}
async function submitTracking(form){const data=new FormData(form);const number=String(data.get('number')||'').trim().toUpperCase();const phone=digits(data.get('phone')).slice(-10);state.trackError='';state.trackResult=null;if(!number||phone.length!==10){state.trackError='Enter an order number and a valid 10-digit mobile number.';return render();}try{let result;if(cloud)result=await cloudCall('track-order',{order_number:number,customer_phone:phone});else result=state.orders.find(o=>o.order_number===number&&digits(o.customer_phone).slice(-10)===phone);if(!result)throw new Error('No matching order found. Check your order number and phone.');state.trackResult=result;state.activeOrder={...state.activeOrder,order_number:number,customer_phone:phone};render();}catch(err){state.trackError=String(err.message||err);render();}}

 const orders=cloud?state.adminOrders:state.orders;const revenue=orders.filter(o=>o.payment_status==='paid').reduce((sum,o)=>sum+Number(o.total_inr||0),0);const active=state.products.filter(p=>p.active!==false);return `<div class="admin-page"><div class="container"><div class="admin-head"><div><span class="eyebrow">GALAXY POINT OPERATIONS</span><h1>Store dashboard</h1><p>${cloud?'Live cloud database':'Demo only · This browser · No login or shared database'}${state.adminSession?.user?.email?' · '+escapeHTML(state.adminSession.user.email):''}</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-outline btn-small" href="#home">VIEW STOREFRONT</a>${cloud?'<button class="btn btn-small" data-action="admin-logout">LOG OUT</button>':'<button class="btn btn-small" data-action="demo-reset">RESET DEMO</button>'}</div></div>

function supaHeaders(auth=false){const h={'apikey':cfg.supabaseAnonKey,'Content-Type':'application/json'};if(auth)h.Authorization='Bearer '+(state.adminSession?.access_token||'');else if(cfg.supabaseAnonKey.startsWith('eyJ'))h.Authorization='Bearer '+cfg.supabaseAnonKey;return h;}
async function supa(path,{method='GET',body,auth=false,prefer}={}){const h=supaHeaders(auth);if(prefer)h.Prefer=prefer;const res=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});const txt=await res.text();let json=null;try{json=txt?JSON.parse(txt):null;}catch{json=txt;}if(!res.ok)throw new Error(json?.message||json?.error_description||json?.msg||`Database error (${res.status})`);return json;}
async function loadCloudProducts(){if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){state.loading=false;state.products=[];render();return;}try{const data=await supa('/rest/v1/products?select=*&order=created_at.desc&limit=250',{auth:state.adminAuthorized});state.products=Array.isArray(data)?data:[];normalizeCart();state.loading=false;render();}catch(err){state.loading=false;state.products=[];render();showToast('Catalog unavailable. Please check your cloud configuration.');}}
async function initializeAdmin(){if(!cloud)return;try{if(!state.adminSession){const stored=sessionStorage.getItem(SESSION_KEY);if(stored)state.adminSession=JSON.parse(stored);}if(!state.adminSession)return render();if(state.adminSession.expires_at&&Date.now()/1000>state.adminSession.expires_at-90){const refresh=await supa('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:state.adminSession.refresh_token}});state.adminSession={...refresh,expires_at:Math.floor(Date.now()/1000)+refresh.expires_in};sessionStorage.setItem(SESSION_KEY,JSON.stringify(state.adminSession));}const user=await supa('/auth/v1/user',{auth:true});const rows=await supa('/rest/v1/admin_users?select=user_id&user_id=eq.'+encodeURIComponent(user.id),{auth:true});if(!Array.isArray(rows)||!rows.length)throw new Error('This account is not authorized as a Galaxy Point admin.');state.adminAuthorized=true;state.adminSession.user=user;await loadCloudProducts();await loadCloudAdminOrders();}catch(err){state.adminAuthorized=false;state.adminError=String(err.message||err);state.adminSession=null;sessionStorage.removeItem(SESSION_KEY);render();}}
async function loadCloudAdminOrders(){if(!cloud||!state.adminAuthorized)return;try{const data=await supa('/rest/v1/orders?select=*,order_items(*)&order=created_at.desc&limit=200',{auth:true});state.adminOrders=Array.isArray(data)?data:[];state.adminError='';render();}catch(err){state.adminError=String(err.message||err);render();}}
async function loginAdmin(form){state.adminError='';state.adminBusy=true;render();try{const data=new FormData(form);const auth=await supa('/auth/v1/token?grant_type=password',{method:'POST',body:{email:String(data.get('email')||''),password:String(data.get('password')||'')}});state.adminSession={...auth,expires_at:Math.floor(Date.now()/1000)+auth.expires_in};sessionStorage.setItem(SESSION_KEY,JSON.stringify(state.adminSession));await initializeAdmin();}catch(err){state.adminError=String(err.message||err);state.adminBusy=false;render();}finally{state.adminBusy=false;}}
async function uploadProductPhoto(file){
 if(!cloud||!state.adminAuthorized)throw new Error('Sign in as a cloud admin to upload a photo.');
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Only JPG, PNG and WebP photos are supported.');
 if(file.size>8*1024*1024)throw new Error('Image is too large. Maximum file size is 8 MB.');
 const objectUrl=URL.createObjectURL(file);
 let bitmap;
 try{bitmap=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Photo could not be read.'));img.src=objectUrl;});
   const canvas=document.createElement('canvas');const scale=Math.min(1,1440/Math.max(bitmap.width,bitmap.height));
   canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
   const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Photo processing is unavailable.');ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',0.84));
   if(!blob)throw new Error('Could not optimize photo for upload.');
   const key='catalog/'+Date.now()+'-'+rand().toLowerCase()+'.webp';
   const base=cfg.supabaseUrl.replace(/\/$/,'');
   const res=await fetch(base+'/storage/v1/object/gp-product-images/'+key,{method:'POST',headers:{'apikey':cfg.supabaseAnonKey,'Authorization':'Bearer '+state.adminSession.access_token,'Content-Type':'image/webp','Cache-Control':'max-age=3600','x-upsert':'false'},body:blob});
   if(!res.ok){const data=await res.json().catch(()=>({}));throw new Error(data.message||data.error||'Photo upload failed. Check Storage bucket setup.');}
   return base+'/storage/v1/object/public/gp-product-images/'+key;
 }finally{URL.revokeObjectURL(objectUrl);}
}
function slugify(text){return String(text).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,75)||'device';}
async function saveProduct(form){if(state.adminBusy)return;const data=new FormData(form);const id=String(data.get('id')||'');const title=String(data.get('title')||'').trim();const price=Number(data.get('price_inr')),stock=Number(data.get('stock'));const url=String(data.get('image_url')||'').trim();if(!title||!Number.isInteger(price)||price<=0||!Number.isInteger(stock)||stock<0){state.adminError='Please enter a valid name, positive price and non-negative stock.';state.modal=null;return render();}if(url&&!safeImage(url)){state.adminError='Product image must use a valid HTTP(S) URL.';state.modal=null;return render();}const fields={title,brand:String(data.get('brand')||'').trim(),category:String(data.get('category')),condition:String(data.get('condition')),variant:String(data.get('variant')||'').trim(),color:String(data.get('color')||'').trim(),price_inr:price,original_price_inr:data.get('original_price_inr')?Number(data.get('original_price_inr')):null,stock,image_url:url||null,description:String(data.get('description')||'').trim(),featured:data.has('featured'),active:data.has('active')};if(!fields.brand||!fields.variant){state.adminError='Brand and variant are required.';state.modal=null;return render();}state.adminBusy=true;try{const photo=data.get('photo_file');if(photo instanceof File && photo.size){fields.image_url=await uploadProductPhoto(photo);}if(cloud){if(id){await supa('/rest/v1/products?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:fields,auth:true,prefer:'return=minimal'});}else{fields.slug=slugify(title)+'-'+rand().toLowerCase();await supa('/rest/v1/products',{method:'POST',body:fields,auth:true,prefer:'return=minimal'});}await loadCloudProducts();}else{if(id){const idx=state.products.findIndex(p=>p.id===id);if(idx<0)throw new Error('Product not found');state.products[idx]={...state.products[idx],...fields};}else state.products.unshift({...fields,id:'demo-'+rand(),slug:slugify(title)+'-'+rand().toLowerCase(),image_url:fields.image_url||''});persist();}state.modal=null;state.adminError='';showToast('Product saved successfully.');}catch(err){state.modal=null;state.adminError=String(err.message||err);render();}finally{state.adminBusy=false;}}
async function deleteProduct(id){
 const p=byId(id);if(!p)return;
 if(!confirm('Remove "'+p.title+'" from the catalog? This cannot be undone. You can hide the product using Edit instead.'))return;
 try{if(cloud){if(!state.adminAuthorized)throw new Error('Admin access required.');
   await supa('/rest/v1/products?id=eq.'+encodeURIComponent(id),{method:'DELETE',auth:true,prefer:'return=minimal'});
   await loadCloudProducts();
 }else{state.products=state.products.filter(x=>String(x.id)!==String(id));delete state.cart[id];persist();}
 showToast('Product removed.');}catch(err){state.adminError=String(err.message||err);render();}
}
async function updateOrderStatus(id,status){if(![...STATUS,'awaiting_payment','expired'].includes(status))return;const orders=cloud?state.adminOrders:state.orders;const o=orders.find(o=>String(o.id||o.order_number)===String(id));if(!o)return;const prior=o.status;if(['cancelled','expired'].includes(prior)&&!['cancelled','expired'].includes(status))return showToast('Cancelled/expired orders cannot be reopened. Create a new order.');if(prior==='completed'&&status!=='completed')return showToast('Completed orders cannot be cancelled here; handle any return manually.');if(o.payment_status==='paid'&&['cancelled','expired'].includes(status)&&!confirm('This is a PAID order. Cancelling does not refund the payment. Confirm you will process any necessary refund separately?'))return;
 try{if(cloud){await supa('/rest/v1/rpc/set_gp_order_status',{method:'POST',body:{p_order_id:id,p_status:status},auth:true});await loadCloudAdminOrders();await loadCloudProducts();}else{if(['cancelled','expired'].includes(status)&&!['cancelled','expired','completed'].includes(prior)&&o.payment_status!=='paid'){(o.items||[]).forEach(line=>{const p=state.products.find(p=>p.title===line.product_title);if(p)p.stock+=line.qty;});}o.status=status;persist();}showToast('Order status updated.');}catch(err){state.adminError=String(err.message||err);render();}}
async function markStorePaid(id){
 const o=(cloud?state.adminOrders:state.orders).find(x=>String(x.id||x.order_number)===String(id));
 if(!o||o.payment_method!=='pay_at_store'||o.payment_status==='paid'||['cancelled','expired'].includes(o.status))return;
 if(!confirm('Confirm payment was actually received by Galaxy Point? This will mark the store-payment order as paid.'))return;
 try{if(cloud){await supa('/rest/v1/rpc/mark_gp_store_paid',{method:'POST',body:{p_order_id:id},auth:true});await loadCloudAdminOrders();}
 else{o.payment_status='paid';persist();}state.modal=null;showToast('Store payment recorded.');}
 catch(err){state.modal=null;state.adminError=String(err.message||err);render();}
}
function exportCSV(){const orders=cloud?state.adminOrders:state.orders;const cols=['order_number','created_at','customer_name','customer_phone','customer_email','fulfillment','delivery_address','status','payment_status','total_inr'];const safeCell=value=>{let str=String(value??'');if(/^[\s]*[=+\-@]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"';};const csv=[cols.join(','),...orders.map(o=>cols.map(k=>safeCell(o[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='galaxy-point-orders-'+new Date().toISOString().slice(0,10)+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function updateShopResults(){const el=document.querySelector('#shop-results');if(!el)return;const ps=filteredProducts();el.innerHTML=productGrid(ps);const status=document.querySelector('.shop-status');if(status)status.textContent=`Showing ${ps.length} product${ps.length===1?'':'s'}${!cloud?' · Demo inventory':''}`;}
let searchTick;
document.addEventListener('input',e=>{if(e.target.id==='shop-search'){state.search=e.target.value;clearTimeout(searchTick);searchTick=setTimeout(updateShopResults,160);}else if(e.target.closest('#checkout-form')&&e.target.name&&e.target.type!=='radio'&&e.target.type!=='checkbox'){state.checkout[e.target.name]=e.target.value;}});
document.addEventListener('change',async e=>{if(e.target.id==='shop-sort'){state.sort=e.target.value;updateShopResults();return;}if(e.target.closest('#checkout-form')&&e.target.type==='radio'){collectCheckoutInput();render();return;}if(e.target.dataset.action==='order-status')await updateOrderStatus(e.target.dataset.id,e.target.value);});
document.addEventListener('submit',async e=>{const form=e.target;const formId=form.getAttribute('id');if(!['checkout-form','track-form','admin-login-form','product-form','global-search-form'].includes(formId))return;e.preventDefault();if(formId==='checkout-form'){await submitCheckout();return;}if(formId==='track-form'){await submitTracking(form);return;}if(formId==='admin-login-form'){await loginAdmin(form);return;}if(formId==='product-form'){await saveProduct(form);return;}if(formId==='global-search-form'){const data=new FormData(form);state.search=String(data.get('search')||'');state.filter='All';state.modal=null;go('#shop');updateShopResults();}});
document.addEventListener('click',e=>{const backdrop=e.target.closest('[data-backdrop]');if(backdrop&&e.target===backdrop){if(backdrop.dataset.backdrop==='mobile')state.mobile=false;else state.modal=null;render();return;}const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;switch(action){
 case 'menu':state.mobile=!state.mobile;render();break;
 case 'search-modal':state.modal={type:'search'};render();setTimeout(()=>document.querySelector('#global-search-form input')?.focus(),0);break;
 case 'close-modal':state.modal=null;render();break;
 case 'add':addToCart(id);break;
 case 'add-detail':addToCart(id,Math.max(1,Math.floor(Number(document.querySelector('#detail-qty')?.value||1))));break;
 case 'remove':delete state.cart[id];persist();render();break;
 case 'qty-minus':updateQty(id,-1);break;
 case 'qty-plus':updateQty(id,1);break;
 case 'wish':state.wish=state.wish.includes(id)?state.wish.filter(x=>x!==id):[...state.wish,id];persist();render();break;
 case 'category':state.filter=target.dataset.category;go('#shop'+(state.filter==='All'?'':'?category='+encodeURIComponent(state.filter)));break;
 case 'clear-filters':state.filter='All';state.search='';go('#shop');break;
 case 'track-recent':state.trackResult=null;go('#track');break;
 case 'admin-tab':state.adminTab=target.dataset.tab;render();break;
 case 'new-product':state.modal={type:'product',product:null};state.adminError='';render();break;
 case 'edit-product':state.modal={type:'product',product:byId(id)};state.adminError='';render();break;
 case 'delete-product':deleteProduct(id);break;
 case 'order-details':{const orders=cloud?state.adminOrders:state.orders;state.modal={type:'order',order:orders.find(o=>String(o.id||o.order_number)===String(id))};render();break;}
 case 'admin-logout':state.adminAuthorized=false;state.adminSession=null;state.adminOrders=[];sessionStorage.removeItem(SESSION_KEY);if(cloud)loadCloudProducts();render();break;
 case 'demo-reset':if(confirm('Reset all demo products, cart and local orders in this browser?')){state.products=demoProducts.map(p=>({...p}));state.cart={};state.orders=[];state.wish=[];persist();showToast('Demo data reset.');}break;
 case 'export-orders':exportCSV();break;
 case 'mark-store-paid':markStorePaid(id);break;
 }});
window.addEventListener('hashchange',parseHash);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.modal||state.mobile)){state.modal=null;state.mobile=false;render();}});
parseHash();
if(cloud){loadCloudProducts();loadSiteSettings();setInterval(()=>{if(!document.hidden&&!state.adminBusy&&!state.modal){loadCloudProducts();loadSiteSettings();}},30000);}
})();
</script></body></html>
