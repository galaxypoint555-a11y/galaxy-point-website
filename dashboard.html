eight:700}.gp-wishlist-table input[type=checkbox]{width:17px;height:17px;accent-color:#4759bd}.gp-wishlist-product-name{font-weight:700;color:#253151}@media(max-width:700px){.gp-wishlist-toolbar{align-items:flex-start}.gp-wishlist-overview-stats{gap:6px}.gp-wishlist-overview-stats span{padding:8px}.gp-wishlist-product{padding:10px}}</style></head>

<div class="layout">

  <aside class="sidebar" id="sidebar">

<script src="gp-config.js"></script><script>
(()=>{'use strict';
const root=document.querySelector('#page'),nav=document.querySelector('#mainNav');
const cfg=window.GP_CONFIG||{},base=(cfg.supabaseUrl||'').replace(/\/$/,'');
let token='',orders=[],products=[],customers=[],items=[],wishlistLeads=[],wishlistSelected=new Set(),loginEvents=[],page='overview',customerLoginTab='mobile_login',period=7;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const headers=()=>({apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'});
async function api(path,options={}){const r=await fetch(base+'/rest/v1/'+path,{...options,headers:{...headers(),...(options.headers||{})}});if(!r.ok)throw Error('Database request failed ('+r.status+'): '+(await r.text()).slice(0,180));return r.status===204?null:r.json();}
function message(s){root.innerHTML='<section class="panel"><p>'+esc(s)+'</p></section>'}
function login(){
 nav.innerHTML='';
 document.querySelector('#breadcrumb').textContent='Sign in';
 document.body.classList.add('gp-boss-signin');
 root.innerHTML='<div class="gp-boss-login-shell"><section class="gp-boss-login-hero"><div class="gp-boss-login-brand"><img src="gp-logo.svg" alt="Galaxy Point logo"><strong>GALAXY POINT</strong></div><div><h1>Welcome Back,<br>Boss.</h1><p>Your business, customers and performance — all in one secure management dashboard.</p></div><div class="gp-boss-login-foot">GALAXY POINT · KHARGHAR</div></section><section class="gp-boss-login-form-area"><h2>Boss Dashboard Login</h2><p class="gp-login-sub">Sign in to access your Galaxy Point management panel.</p><form id="loginForm"><label>Email Address<input type="email" name="email" placeholder="Enter your email address" required autocomplete="username"></label><label>Password<input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"></label><button class="btn primary" id="signInBtn" type="submit">Sign In to Dashboard</button><p id="loginError" class="rule" role="alert" aria-live="polite"></p></form></section></div>';
 const form=document.querySelector('#loginForm'),error=document.querySelector('#loginError'),btn=document.querySelector('#signInBtn');
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(btn.disabled)return;
  const f=new FormData(form);
  btn.disabled=true;btn.textContent='Signing in…';error.textContent='Connecting securely to Galaxy Point…';
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
   if(!base||!cfg.supabaseAnonKey)throw Error('Dashboard configuration missing. Please contact the administrator.');
   const res=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',signal:controller.signal,headers:{apikey:cfg.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({email:String(f.get('email')||'').trim(),password:f.get('password')})});
   const data=await res.json().catch(()=>({}));
   if(!res.ok||!data.access_token)throw Error(data.error_description||data.msg||data.error||'Email or password is incorrect.');
   if(String(data.user?.email||'').trim().toLowerCase()!=='jagdish@gmail.com')throw Error('Access denied. This dashboard is reserved for the Boss account.');
   token=data.access_token;error.textContent='Login successful. Checking dashboard access…';
   const staff=await Promise.race([api('staff_profiles?select=role&user_id=eq.'+encodeURIComponent(data.user.id)),new Promise((_,reject)=>setTimeout(()=>reject(Error('Permission check timed out. Please try again.')),12000))]);
   if(!staff.length||staff[0].role!=='boss')throw Error('Boss-only access required. This account does not have the boss role.');
   error.textContent='Access approved. Loading dashboard…';
   await load();
  }catch(err){
   token='';
   error.textContent=err.name==='AbortError'?'Connection timed out. Check internet and try again.':(err.message||'Sign in failed. Please try again.');
  }finally{clearTimeout(timer);btn.disabled=false;btn.textContent='Sign in';}
 });
}
async function load(){try{[orders,products,customers,items]=await Promise.all([api('orders?select=*&order=created_at.desc&limit=500'),api('products?select=*&order=created_at.desc&limit=500'),api('customers?select=*&limit=500'),api('order_items?select=*&limit=1000')]);try{wishlistLeads=await api('wishlist_leads?select=*&order=created_at.desc&limit=500')}catch(e){wishlistLeads=[];console.warn('Wishlist table not configured:',e.message)}try{loginEvents=await api('customer_login_events?select=*&order=created_at.desc&limit=1000')}catch(e){loginEvents=[];console.warn('Customer login events unavailable:',e.message)}render();}catch(e){message(e.message)}}
const recent=()=>orders.filter(o=>new Date(o.created_at)>=new Date(Date.now()-period*86400000));
const paid=()=>recent().filter(o=>o.payment_status==='Paid');
const kpi=(name,value)=>'<div class="kpi"><div class="kpi-label">'+name+'</div><div class="kpi-val">'+value+'</div></div>';
const tabs=()=>'<div class="period">'+[1,7,30].map(d=>'<button data-period="'+d+'" class="'+(period===d?'active':'')+'">'+(d===1?'Today':d+' days')+'</button>').join('')+'</div>';
const bossGreeting=()=>{const hour=Number(new Intl.DateTimeFormat('en-GB',{hour:'numeric',hour12:false,timeZone:'Asia/Kolkata'}).format(new Date()));return hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';};
const heading=(title,desc)=>'<div class="pagehead '+(page==='customers'?'gp-customer-header':'')+'"><div>'+(page==='overview'?'<div class="eyebrow">YOUR WEBSITE, UNDER CONTROL</div><h1 class="page-title" id="bossGreeting">'+bossGreeting()+', Jagdish 👋</h1>':'<h1 class="page-title">'+title+'</h1>')+'<p class="subtitle">'+desc+'</p></div><div class="page-tools">'+tabs()+'</div></div>';
setInterval(()=>{const greeting=document.querySelector('#bossGreeting');if(greeting)greeting.textContent=bossGreeting()+', Jagdish 👋';},60000);
const cname=id=>customers.find(c=>c.id===id)||{};
const orderRows=arr=>'<div class="table-wrap"><table class="data-table"><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Fulfillment</th><th>Action</th></tr></thead><tbody>'+ (arr.length?arr.map(o=>'<tr><td class="td-strong">'+esc(o.order_number||o.id)+'</td><td>'+esc(cname(o.customer_id).name||'—')+'</td><td>'+money(o.total_amount)+'</td><td>'+esc(o.payment_status)+'</td><td>'+esc(o.fulfillment_status)+'</td><td><button class="linkbtn" data-order="'+esc(o.id)+'">View</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">No orders found.</td></tr>')+'</tbody></table></div>';
const productRows=()=>'<div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Category</th><th>Variant</th><th>Price</th><th>Stock</th><th>Published</th></tr></thead><tbody>'+products.map(p=>'<tr><td class="td-strong">'+esc(p.title||p.name||'Unnamed product')+'</td><td>'+esc(p.category)+'</td><td>'+esc(p.variant)+'</td><td>'+money(p.price_inr??p.price)+'</td><td>'+Number(p.stock||0)+'</td><td>'+(p.is_published?'Yes':'No')+'</td></tr>').join('')+'</tbody></table></div>';
const wishlistSummary=()=>{const byProduct=new Map();wishlistLeads.forEach(w=>{const name=String(w.product_name||'Unknown product').trim()||'Unknown product';const item=byProduct.get(name)||{name,count:0,customers:new Set()};item.count++;if(w.phone)item.customers.add(String(w.phone).trim());byProduct.set(name,item)});const top=[...byProduct.values()].sort((a,b)=>b.count-a.count).slice(0,6);return top.length?'<div class="gp-wishlist-top-products">'+top.map((p,i)=>'<div class="gp-wishlist-product"><span class="gp-wishlist-rank">'+(i+1)+'</span><strong>'+esc(p.name)+'</strong><span>'+p.count+' '+(p.count===1?'like':'likes')+' · '+p.customers.size+' customers</span></div>').join('')+'</div>':'<p class="gp-wishlist-empty">No wishlist interest recorded yet.</p>'};
const wishlistRows=(rows,editable)=>'<div class="table-wrap"><table class="data-table gp-wishlist-table"><thead><tr>'+(editable?'<th><input type="checkbox" id="gp-wishlist-all" aria-label="Select all wishlist leads" '+(rows.length&&rows.every(w=>wishlistSelected.has(String(w.id)))?'checked':'')+'></th>':'')+'<th>Date</th><th>Customer</th><th>Mobile</th><th>Product Liked</th><th>Action</th></tr></thead><tbody>'+(rows.length?rows.map(w=>'<tr>'+(editable?'<td><input type="checkbox" data-wishlist-select="'+esc(w.id)+'" '+(wishlistSelected.has(String(w.id))?'checked':'')+' aria-label="Select wishlist lead"></td>':'')+'<td>'+esc(w.created_at?new Date(w.created_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}):'—')+'</td><td>'+esc(w.customer_name||'—')+'</td><td>'+esc(w.phone||'—')+'</td><td class="gp-wishlist-product-name">'+esc(w.product_name||'—')+'</td><td><div class="gp-wishlist-row-actions">'+(w.phone?'<a href="tel:'+encodeURIComponent(w.phone)+'">Call</a>':'')+(editable?'<button type="button" class="gp-wishlist-remove-one" data-wishlist-remove="'+esc(w.id)+'">Remove</button>':'')+'</div></td></tr>').join(''):'<tr><td colspan="'+(editable?'6':'5')+'">No wishlist leads yet.</td></tr>')+'</tbody></table></div>';
const loginRows=source=>{const list=loginEvents.filter(x=>x.source===source);return '<div class="table-wrap"><table class="data-table gp-customer-table"><thead><tr><th>Date / Time</th><th>Customer Name</th><th>Mobile Number</th><th>Action</th></tr></thead><tbody>'+(list.length?list.map(x=>'<tr><td class="gp-customer-date">'+esc(new Date(x.created_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}))+'</td><td class="gp-customer-name">'+esc(x.customer_name)+'</td><td class="gp-customer-phone">'+esc(x.phone)+'</td><td><button class="linkbtn" data-delete-login="'+esc(x.id)+'">Remove</button></td></tr>').join(''):'<tr><td colspan="4">No recorded logins</td></tr>')+'</tbody></table></div>'};
const customerRows=()=>'<div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>City</th></tr></thead><tbody>'+customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.city)+'</td></tr>').join('')+'</tbody></table></div>';
function render(){document.body.classList.remove('gp-boss-signin');const navItems=[['overview','Overview'],['orders','Orders'],['products','Products & Stock'],['customers','Customers'],['wishlist','Wishlist Leads'],['analytics','Analytics'],['settings','Settings']];nav.innerHTML=navItems.map(([id,title])=>'<button class="nav-btn '+(page===id?'active':'')+'" data-page="'+id+'">'+title+'</button>').join('');document.querySelector('#breadcrumb').textContent=navItems.find(x=>x[0]===page)?.[1]||'Overview';const list=recent(),p=paid(),revenue=p.reduce((a,o)=>a+Number(o.total_amount||0),0);let content='';
if(page==='overview')content=heading('Business Overview','Live records from Galaxy Point Supabase')+'<div class="kpi-grid">'+kpi('Paid Orders',p.length)+kpi('Pending Payments',list.filter(o=>o.payment_status==='Pending').length)+kpi('Paid Revenue',money(revenue))+kpi('New Paid Orders',p.filter(o=>o.fulfillment_status==='New').length)+kpi('Products',products.length)+kpi('Customers',customers.length)+kpi('Wishlist Customers',new Set(wishlistLeads.map(w=>String(w.phone||'').replace(/\D/g,'').slice(-10)).filter(x=>x.length===10)).size)+'</div><section class="panel gp-wishlist-overview"><div class="panel-head"><div class="panel-title">Wishlist Interest · What customers like</div><button class="gp-wishlist-open" data-open-wishlist type="button">View All Leads →</button></div><div class="gp-wishlist-overview-stats"><span><b>'+new Set(wishlistLeads.map(w=>String(w.phone||'').replace(/\D/g,'').slice(-10)).filter(x=>x.length===10)).size+'</b> unique customers by mobile number</span></div>'+wishlistSummary()+'<div class="gp-wishlist-recent-title">Latest customer interest</div>'+wishlistRows(wishlistLeads.slice(0,5),false)+'</section><section class="panel"><div class="panel-head"><div class="panel-title">Recent Orders</div></div>'+orderRows(list.slice(0,10))+'</section>';
if(page==='orders')content=heading('Orders Management','Real orders and fulfillment status')+'<section class="panel">'+orderRows(list)+'</section>';
if(page==='products')content=heading('Product & Stock Overview','Inventory synchronized with the website editor')+'<section class="panel">'+productRows()+'</section>';
if(page==='customers')content=heading('Customers','Customer registrations by platform')+'<section class="panel"><div class="gp-customer-actions"><button class="gp-customer-refresh" id="gp-refresh-customers" type="button">↻ Refresh Customers</button><span class="gp-customer-refresh-status" id="gp-customer-refresh-status" role="status">Latest customer logins</span></div><div class="gp-customer-tabs"><button data-login-tab="mobile_login" class="'+(customerLoginTab==='mobile_login'?'active':'')+'"><span class="gp-customer-tab-title">Mobile Login</span><span class="gp-customer-tab-count">'+loginEvents.filter(x=>x.source==='mobile_login').length+'</span><span class="gp-customer-tab-desc">App customer registrations</span></button><button data-login-tab="website_login" class="'+(customerLoginTab==='website_login'?'active':'')+'"><span class="gp-customer-tab-title">Website Login</span><span class="gp-customer-tab-count">'+loginEvents.filter(x=>x.source==='website_login').length+'</span><span class="gp-customer-tab-desc">Website customer registrations</span></button></div><div class="gp-customer-record-heading">'+(customerLoginTab==='mobile_login'?'Mobile Login':'Website Login')+' · '+loginEvents.filter(x=>x.source===customerLoginTab).length+' records</div>'+loginRows(customerLoginTab)+'</section>';
if(page==='wishlist')content=heading('Wishlist Leads','See what customers liked and manage enquiries')+'<section class="panel"><div class="gp-wishlist-toolbar"><div><div class="panel-title">Customer Wishlist ('+wishlistLeads.length+')</div><div class="gp-wishlist-subtitle">Select individual leads or select multiple records to remove.</div></div><div class="gp-wishlist-actions"><span id="gp-wishlist-selection-count">0 selected</span><button type="button" id="gp-wishlist-select-all" class="gp-wishlist-secondary">Select All</button><button type="button" id="gp-wishlist-remove-selected" class="gp-wishlist-danger" disabled>Remove Selected</button></div></div>'+wishlistRows(wishlistLeads,true)+'</section>';
if(page==='analytics')content=heading('Sales Analytics','Paid orders only; website traffic tracking is not configured')+'<div class="kpi-grid">'+kpi('Paid Revenue',money(revenue))+kpi('Paid Orders',p.length)+kpi('Average Order',money(p.length?revenue/p.length:0))+'</div><section class="panel"><div class="panel-title">Sales by source</div>'+(['Instagram','YouTube','WhatsApp','Facebook','Direct','Other'].map(src=>'<div class="source-row"><label>'+src+'</label><span>'+p.filter(o=>(o.customer_source||'Other')===src).length+' paid</span></div>').join(''))+'</section>';
if(page==='settings')content=heading('Dashboard Settings','Connected to the Galaxy Point database')+'<section class="panel"><p>Orders marked Paid must be verified by a secure payment backend. Online checkout remains disabled until payment verification is configured.</p><p><a class="btn primary" href="editor.html">Open Website Editor</a></p><button class="btn" id="refresh">Refresh data</button><button class="btn" id="logout">Sign out</button></section>';
root.innerHTML=content;root.querySelectorAll('[data-open-wishlist]').forEach(b=>b.onclick=()=>{page='wishlist';render()});
const updateWishlistSelection=()=>{const n=wishlistSelected.size,indicator=root.querySelector('#gp-wishlist-selection-count'),btn=root.querySelector('#gp-wishlist-remove-selected'),all=root.querySelector('#gp-wishlist-all');if(indicator)indicator.textContent=n+' selected';if(btn)btn.disabled=n===0;if(all)all.checked=wishlistLeads.length>0&&wishlistLeads.every(w=>wishlistSelected.has(String(w.id)))};
root.querySelectorAll('[data-wishlist-select]').forEach(b=>b.onchange=()=>{const id=String(b.dataset.wishlistSelect);if(b.checked)wishlistSelected.add(id);else wishlistSelected.delete(id);updateWishlistSelection()});
const allWishlist=root.querySelector('#gp-wishlist-all');if(allWishlist)allWishlist.onchange=()=>{wishlistSelected=allWishlist.checked?new Set(wishlistLeads.map(w=>String(w.id))):new Set();render()};
const selectWishlist=root.querySelector('#gp-wishlist-select-all');if(selectWishlist)selectWishlist.onclick=()=>{wishlistSelected=new Set(wishlistLeads.map(w=>String(w.id)));render()};
const removeWishlist=async ids=>{const valid=[...new Set(ids.map(String))].filter(id=>wishlistLeads.some(w=>String(w.id)===id));if(!valid.length)return;if(!confirm('Permanently remove '+valid.length+' wishlist '+(valid.length===1?'lead':'leads')+'? This cannot be undone.'))return;root.querySelectorAll('.gp-wishlist-remove-one,#gp-wishlist-remove-selected').forEach(b=>b.disabled=true);try{const filter=valid.map(id=>'"'+id.replace(/["\\]/g,'')+'"').join(',');const removed=await api('wishlist_leads?id=in.('+encodeURIComponent(filter)+')&select=id',{method:'DELETE',headers:{Prefer:'return=representation'}});if(!Array.isArray(removed)||removed.length!==valid.length)throw Error('Database did not confirm removal of all selected records. Check boss delete permissions.');wishlistSelected=new Set();await load()}catch(err){alert('Could not remove wishlist lead(s): '+err.message);render()}};
root.querySelectorAll('[data-wishlist-remove]').forEach(b=>b.onclick=()=>removeWishlist([b.dataset.wishlistRemove]));const removeSelected=root.querySelector('#gp-wishlist-remove-selected');if(removeSelected)removeSelected.onclick=()=>removeWishlist([...wishlistSelected]);updateWishlistSelection();
nav.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});root.querySelectorAll('[data-delete-login]').forEach(b=>b.onclick=async()=>{const id=b.dataset.deleteLogin;const record=loginEvents.find(x=>String(x.id)===id);if(!record||!confirm('Remove login record for '+record.customer_name+' ('+record.phone+')? This cannot be undone.'))return;b.disabled=true;try{await api('customer_login_events?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await load()}catch(e){alert('Could not remove customer login: '+e.message);b.disabled=false}});if(root.querySelector('#gp-refresh-customers'))root.querySelector('#gp-refresh-customers').onclick=async()=>{const btn=root.querySelector('#gp-refresh-customers'),status=root.querySelector('#gp-customer-refresh-status');btn.disabled=true;btn.textContent='↻ Refreshing…';status.textContent='Checking latest customer logins…';try{const fresh=await api('customer_login_events?select=*&order=created_at.desc&limit=1000');loginEvents=fresh;render();const result=root.querySelector('#gp-customer-refresh-status');if(result)result.textContent='Updated just now · '+fresh.length+' login records'}catch(e){btn.disabled=false;btn.textContent='↻ Refresh Customers';status.textContent='Refresh failed: '+e.message}};root.querySelectorAll('[data-login-tab]').forEach(b=>b.onclick=()=>{customerLoginTab=b.dataset.loginTab;render()});root.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=+b.dataset.period;render()});root.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>showOrder(b.dataset.order));if(root.querySelector('#refresh'))root.querySelector('#refresh').onclick=load;if(root.querySelector('#logout'))root.querySelector('#logout').onclick=()=>{token='';login()};}
function showOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const allowed=['New','Processing','Packed','Shipped','Delivered'];const next=allowed[allowed.indexOf(o.fulfillment_status)+1];const orderItems=items.filter(i=>i.order_id===id);const modal=document.querySelector('#modalRoot');modal.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div class="panel-title">Order '+esc(o.order_number||o.id)+'</div><button class="btn" id="closeOrder">Close</button></div><div class="modal-body"><p>Customer: '+esc(cname(o.customer_id).name||'—')+'</p><p>Payment: '+esc(o.payment_status)+' · '+money(o.total_amount)+'</p><p>Fulfillment: '+esc(o.fulfillment_status)+'</p>'+orderItems.map(i=>'<p>'+esc(i.product_name)+' '+esc(i.variant)+' × '+Number(i.quantity||0)+'</p>').join('')+'</div><div class="modal-foot">'+(o.payment_status==='Paid'&&next?'<button class="btn primary" id="advance">Mark '+next+'</button>':'')+'</div></div></div>';modal.querySelector('#closeOrder').onclick=()=>modal.innerHTML='';if(modal.querySelector('#advance'))modal.querySelector('#advance').onclick=async()=>{try{await api('orders?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({fulfillment_status:next})});modal.innerHTML='';await load();}catch(e){alert(e.message)}};}
if(!base||!cfg.supabaseAnonKey)message('Supabase configuration missing.');else login();
})();
</script>
