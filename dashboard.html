<style>
:root { --bg:#f5f7fb; --surface:#fff; --ink:#17233d; --muted:#7b879a; --line:#e9edf4; --brand:#3c63e9; --navy:#12244a; --success:#169b6b; --warning:#e99e20; --red:#d85e64; --radius:17px; --shadow:0 8px 35px rgba(20,40,85,.035); }
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}
.layout{min-height:100vh;display:flex}.sidebar{width:255px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40}.brand{height:90px;display:flex;align-items:center;gap:11px;padding:0 24px;border-bottom:1px solid #f0f2f7}.logo{width:43px;height:43px;border-radius:13px;background:#13275a;color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px;letter-spacing:-1px}.brand-title{font-size:17px;letter-spacing:-.45px;font-weight:850;line-height:1.15}.brand-sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.6px;margin-top:3px}.nav-label{text-transform:uppercase;letter-spacing:1.4px;font-size:10px;color:#a6afbf;font-weight:800;padding:25px 26px 10px}.nav{display:grid;gap:5px;padding:0 13px}.nav-btn{width:100%;display:flex;gap:13px;align-items:center;border:0;background:none;text-align:left;padding:13px;border-radius:11px;color:#66758e;font-weight:650;transition:.15s}.nav-btn:hover{background:#f4f6fd;color:#2e4d94}.nav-btn.active{background:#edf2ff;color:#365be0}.sidebar-spacer{flex:1}.side-help{margin:12px 16px 16px;border:1px solid #e6ebfa;border-radius:14px;background:#f7f9ff;padding:16px}.side-help strong{display:block;font-size:12px}.side-help p{font-size:11.5px;color:#8190a8;margin:5px 0 11px}.side-help a,.side-help button{display:inline-block;border:1px solid #dbe3fa;background:#fff;border-radius:8px;padding:8px 10px;color:#4765bb;font-size:11px;font-weight:800}.side-foot{border-top:1px solid var(--line);padding:16px 24px;display:flex;gap:10px;align-items:center}.avatar{height:37px;width:37px;border-radius:11px;display:grid;place-items:center;background:#ecf0ff;color:#3659b5;font-weight:800}.side-foot strong{font-size:12px}.side-foot small{font-size:11px;display:block;color:#96a0b0}
.main{margin-left:255px;width:calc(100% - 255px);min-width:0}.topbar{height:75px;padding:0 34px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:25}.crumb{font-size:13px;font-weight:700;color:#61718a}.crumb b{color:#1d2d49}.top-actions{display:flex;align-items:center;gap:11px}.demo-chip{font-size:11px;color:#168456;background:#e8f7ef;border:1px solid #c4eed5;font-weight:800;letter-spacing:.35px;border-radius:100px;padding:7px 11px;white-space:nowrap}.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid #eef0f7;background:white;color:#6b7b94}.top-profile{display:flex;align-items:center;gap:9px;padding-left:11px;border-left:1px solid #e9edf4;margin-left:3px}.top-profile span{font-size:12px;font-weight:700}.top-profile small{font-size:10px;color:#9da8b6;display:block}.circle-avatar{width:33px;height:33px;border-radius:50%;background:#172b57;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}
.content{padding:31px 34px 45px;max-width:1660px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:25px}.eyebrow{color:#8b9bb5;text-transform:uppercase;letter-spacing:1.6px;font-size:10px;font-weight:850;margin-bottom:8px}.page-title{font-size:29px;line-height:1.2;letter-spacing:-1.2px;font-weight:850;margin:0}.subtitle{color:#8a98ae;margin:9px 0 0;font-size:13px}.page-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border:1px solid #e3e9f3;border-radius:10px;background:#fff;color:#465b7b;font-weight:700;font-size:12px;white-space:nowrap}.btn:hover{border-color:#bdcdf9;background:#f9faff}.btn.primary{color:#fff;background:#3b62e4;border-color:#3b62e4;box-shadow:0 5px 14px #3b62e41d}.btn.primary:hover{background:#2c50cf}.period{display:flex;gap:3px;background:#eaeff7;padding:4px;border-radius:10px}.period button{border:0;background:transparent;border-radius:7px;padding:8px 12px;font-size:11px;font-weight:800;color:#8492a7}.period button.active{background:white;color:#2c4caa;box-shadow:0 2px 8px #22334412}
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-bottom:19px}.kpi{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px;border-radius:var(--radius);min-height:130px;display:flex;flex-direction:column;justify-content:space-between}.kpi-label{font-size:12px;color:#7a8aa2;font-weight:750}.kpi-val{font-weight:850;font-size:30px;letter-spacing:-1px;margin-top:11px;line-height:1.1}
.panel{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:22px;min-width:0;margin-bottom:19px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.panel-title{font-weight:800;font-size:15px;letter-spacing:-.3px}
.table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}.data-table th{text-transform:uppercase;letter-spacing:.8px;font-size:10px;color:#9daabb;font-weight:900;border-bottom:1px solid #e9eef5;padding:14px 11px}.data-table td{border-bottom:1px solid #f0f3f7;padding:14px 11px;font-size:12px;color:#5a6a82}.td-strong{font-weight:800;color:#283b5e!important}.linkbtn{color:#4c68ca;font-size:12px;font-weight:800;border:0;background:transparent;padding:4px 0}.source-row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:9px;margin:14px 0}.empty{text-align:center;color:#9aa6b7;padding:35px 14px}.rule{margin:12px 0 0;color:#c33;font-size:13px}
.modal-backdrop{position:fixed;inset:0;background:#0d1e3aa0;z-index:100;display:flex;justify-content:center;align-items:center;padding:22px}.modal{background:#fff;border-radius:19px;max-width:570px;width:100%;max-height:90vh;overflow-y:auto}.modal-head{padding:21px 24px;border-bottom:1px solid #e9edf3;display:flex;align-items:center;justify-content:space-between}.modal-body{padding:23px 24px}.modal-foot{border-top:1px solid #edf0f5;padding:17px 24px;display:flex;justify-content:flex-end;gap:9px}
.mobile-menu{display:none}.mobile-shade{display:none}
@media(max-width:840px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.mobile-open{transform:translateX(0)}.mobile-shade.show{display:block;position:fixed;inset:0;background:#11204070;z-index:35}.mobile-menu{display:grid}.main{width:100%;margin-left:0}}

.gp-customer-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:26px}.gp-customer-tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:#f8faff;border:1.5px solid #e1e8f5;border-radius:18px;padding:24px 26px;color:#344765;min-height:145px}.gp-customer-tabs button.active{background:#eef3ff;border-color:#5478dc}.gp-customer-tab-title{font-size:18px;font-weight:850}.gp-customer-tab-count{font-size:32px;font-weight:900;color:#253b73;line-height:1}.gp-customer-tab-desc{font-size:12px;color:#788ba7;font-weight:600}.gp-customer-record-heading{font-size:17px;font-weight:850;color:#25375b;margin:0 0 15px}.gp-customer-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;flex-wrap:wrap}.gp-customer-refresh{border:1px solid #cbd8f1;border-radius:11px;background:#f1f5ff;color:#2c4caa;font-weight:800;font-size:13px;padding:10px 16px}.gp-customer-refresh-status{font-size:12px;color:#71839d}
.gp-wishlist-overview{margin-top:20px}.gp-wishlist-open{border:1px solid #d8def0;background:#f5f7ff;color:#3549a1;border-radius:9px;padding:9px 13px;font-weight:700}.gp-wishlist-overview-stats{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.gp-wishlist-overview-stats span{padding:10px 14px;border-radius:10px;background:#f4f6fc;color:#65718a;font-size:13px}.gp-wishlist-top-products{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;margin:18px 0}.gp-wishlist-product{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #e7eaf4;background:#fff;border-radius:12px;padding:13px}.gp-wishlist-rank{width:24px;height:24px;border-radius:7px;background:#edf0ff;color:#4557b5;display:grid;place-items:center;font-size:12px;font-weight:800}.gp-wishlist-recent-title{font-size:14px;font-weight:800;color:#26314d;margin:20px 0 12px}.gp-wishlist-toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.gp-wishlist-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.gp-wishlist-secondary,.gp-wishlist-danger,.gp-wishlist-remove-one{border-radius:8px;padding:9px 12px;font-weight:700;font-size:12px}.gp-wishlist-secondary{background:#eef1fc;color:#4356a9;border:1px solid #dce2f4}.gp-wishlist-danger,.gp-wishlist-remove-one{background:#fff1f1;color:#b33443;border:1px solid #f2ccd1}.gp-wishlist-danger:disabled{opacity:.45;cursor:not-allowed}.gp-wishlist-row-actions{display:flex;gap:9px;align-items:center}
body.gp-boss-signin{background:#eef2fb}body.gp-boss-signin .sidebar{display:none!important}body.gp-boss-signin .main{margin-left:0!important;width:100%!important}body.gp-boss-signin .topbar{display:none!important}body.gp-boss-signin .content{max-width:none!important;width:100%!important;padding:clamp(18px,4vw,55px)!important;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 12% 20%,#c8d7ff 0,transparent 38%),radial-gradient(circle at 90% 88%,#d5e0fa 0,transparent 38%),#f5f7fc}
.gp-boss-login-shell{width:min(1100px,100%);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(350px,.9fr);overflow:hidden;background:#fff;border-radius:28px;box-shadow:0 28px 90px #20355c20;border:1px solid #e5eaf4;min-height:580px}.gp-boss-login-hero{background:linear-gradient(145deg,#10244f,#264f9e 70%,#4677d4);padding:clamp(32px,5vw,60px);display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden}.gp-boss-login-brand{display:flex;align-items:center;gap:14px}.gp-boss-login-brand img{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:18px;padding:6px}.gp-boss-login-brand strong{font-size:22px}.gp-boss-login-hero h1{font-size:clamp(38px,4.6vw,57px);line-height:1.12;letter-spacing:-1.7px;margin:25px 0 18px}.gp-boss-login-hero p{font-size:16px;line-height:1.75;color:#dce7ff;max-width:390px}.gp-boss-login-foot{font-size:12px;letter-spacing:1.2px;color:#d5e3ff}.gp-boss-login-form-area{padding:clamp(30px,5vw,65px);display:flex;flex-direction:column;justify-content:center}.gp-boss-login-form-area h2{font-size:32px;letter-spacing:-.8px;margin:0 0 8px;color:#182e55}.gp-boss-login-form-area .gp-login-sub{color:#788ba6;margin:0 0 35px;font-size:14px}.gp-boss-login-form-area label{display:block;font-size:14px;font-weight:750;color:#33496d;margin-bottom:20px}.gp-boss-login-form-area input{width:100%;display:block;margin:9px 0 0;padding:15px 16px;border-radius:12px;border:1.5px solid #dce4f1;background:#fbfcff;font-size:15px}.gp-boss-login-form-area #signInBtn{width:100%;padding:15px;font-size:15px;border-radius:12px;margin-top:6px}@media(max-width:800px){.gp-boss-login-shell{grid-template-columns:1fr}.gp-boss-login-hero{min-height:220px;padding:28px}.gp-boss-login-hero h1{font-size:34px;margin:15px 0 5px}}
</style>

<body>
<div class="layout">
  <div id="mobileShade" class="mobile-shade"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo" style="background:#fff;overflow:hidden"><img src="gp-logo.svg" alt="Galaxy Point logo" style="width:100%;height:100%;object-fit:contain"></div><div><div class="brand-title">Galaxy Point</div><div class="brand-sub">BOSS PANEL</div></div></div>
    <div class="nav-label">Management</div>
    <nav class="nav" id="mainNav" aria-label="Main navigation"></nav>
    <div class="sidebar-spacer"></div>
    <div class="side-help"><strong>Website Management</strong><p>Videos, banners and prices are edited in the website editor panel.</p><a href="editor.html">Open Editor Panel ↗</a></div>
    <div class="side-foot"><div class="avatar">GP</div><div><strong>Galaxy Point Team</strong><small>Boss &amp; Manager</small></div></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px"><button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button><div class="crumb">Galaxy Point <span style="color:#c1c9d7;padding:0 8px">/</span> <b id="breadcrumb">Overview</b></div></div>
      <div class="top-actions"><span class="demo-chip">● FIREBASE LIVE</span><div class="top-profile"><div class="circle-avatar">GP</div><div><span>Jagdish</span><small>Boss Account</small></div></div></div>
    </header>
    <main class="content" id="page" aria-live="polite"></main>
  </div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script src="gp-config.js?v=20261122-fb4"></script><script src="gp-cloud.js?v=20261122-fb4"></script><script>
(()=>{'use strict';
const root=document.querySelector('#page'),nav=document.querySelector('#mainNav'),crumb=document.querySelector('#breadcrumb');
const cloud=window.GPCloud;
let orders=[],products=[],customers=[],items=[],wishlistLeads=[],wishlistSelected=new Set(),loginEvents=[],page='overview',customerLoginTab='mobile_login',period=7;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function message(s){root.innerHTML='<section class="panel"><p>'+esc(s)+'</p></section>'}
document.querySelector('#mobileMenu')?.addEventListener('click',()=>{document.querySelector('#sidebar').classList.toggle('mobile-open');document.querySelector('#mobileShade').classList.toggle('show')});
document.querySelector('#mobileShade')?.addEventListener('click',()=>{document.querySelector('#sidebar').classList.remove('mobile-open');document.querySelector('#mobileShade').classList.remove('show')});
function login(){
 nav.innerHTML='';
 crumb.textContent='Sign in';
 document.body.classList.add('gp-boss-signin');
 root.innerHTML='<div class="gp-boss-login-shell"><section class="gp-boss-login-hero"><div class="gp-boss-login-brand"><img src="gp-logo.svg" alt="Galaxy Point logo"><strong>GALAXY POINT</strong></div><div><h1>Welcome Back,<br>Boss.</h1><p>Your business, customers and performance — all in one secure management dashboard.</p></div><div class="gp-boss-login-foot">GALAXY POINT · KHARGHAR</div></section><section class="gp-boss-login-form-area"><h2>Boss Dashboard Login</h2><p class="gp-login-sub">Sign in to access your Galaxy Point management panel.</p><form id="loginForm"><label>Email Address<input type="email" name="email" placeholder="Enter your email address" required autocomplete="username"></label><label>Password<input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"></label><button class="btn primary" id="signInBtn" type="submit">Sign In to Dashboard</button><p id="loginError" class="rule" role="alert" aria-live="polite"></p></form></section></div>';
 const form=document.querySelector('#loginForm'),error=document.querySelector('#loginError'),btn=document.querySelector('#signInBtn');
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(btn.disabled)return;
  const f=new FormData(form);
  btn.disabled=true;btn.textContent='Signing in…';error.textContent='Connecting securely to Galaxy Point…';
  try{
   const res=await cloud.signIn(String(f.get('email')||'').trim(),f.get('password'));
   if(res.role!=='boss'){await cloud.signOut();throw Error('Boss-only access required.');}
   error.textContent='Access approved. Loading dashboard…';
   await load();
  }catch(err){
   error.textContent=err.message||'Sign in failed. Please try again.';
  }finally{btn.disabled=false;btn.textContent='Sign In to Dashboard';}
 });
}
async function load(){
 try{
  [orders,products,customers,items,wishlistLeads,loginEvents]=await Promise.all([
   cloud.listCollection('orders').catch(()=>[]),
   cloud.products().catch(()=>[]),
   cloud.listCollection('customers').catch(()=>[]),
   cloud.listCollection('order_items').catch(()=>[]),
   cloud.listCollection('wishlist_leads').catch(()=>[]),
   cloud.listCollection('customer_login_events').catch(()=>[])
  ]);
  render();
 }catch(e){message(e.message)}
}
const recent=()=>orders.filter(o=>new Date(o.created_at)>=new Date(Date.now()-period*86400000));
const paid=()=>recent().filter(o=>o.payment_status==='Paid');
const kpi=(name,value)=>'<div class="kpi"><div class="kpi-label">'+name+'</div><div class="kpi-val">'+value+'</div></div>';
const tabs=()=>'<div class="period">'+[1,7,30].map(d=>'<button data-period="'+d+'" class="'+(period===d?'active':'')+'">'+(d===1?'Today':d+' days')+'</button>').join('')+'</div>';
const bossGreeting=()=>{const hour=Number(new Intl.DateTimeFormat('en-GB',{hour:'numeric',hour12:false,timeZone:'Asia/Kolkata'}).format(new Date()));return hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';};
const heading=(title,desc)=>'<div class="pagehead"><div>'+(page==='overview'?'<div class="eyebrow">YOUR WEBSITE, UNDER CONTROL</div><h1 class="page-title" id="bossGreeting">'+bossGreeting()+', Jagdish 👋</h1>':'<h1 class="page-title">'+title+'</h1>')+'<p class="subtitle">'+desc+'</p></div><div class="page-tools">'+tabs()+'</div></div>';
const cname=id=>customers.find(c=>c.id===id)||{};
const orderRows=arr=>'<div class="table-wrap"><table class="data-table"><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Fulfillment</th><th>Action</th></tr></thead><tbody>'+ (arr.length?arr.map(o=>'<tr><td class="td-strong">'+esc(o.order_number||o.id)+'</td><td>'+esc(cname(o.customer_id).name||o.customer_name||'—')+'</td><td>'+money(o.total_amount)+'</td><td>'+esc(o.payment_status||'Pending')+'</td><td>'+esc(o.fulfillment_status||'New')+'</td><td><button class="linkbtn" data-order="'+esc(o.id)+'">View</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">No orders found.</td></tr>')+'</tbody></table></div>';
const productRows=()=>'<div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Category</th><th>Variant</th><th>Price</th><th>Stock</th><th>Published</th></tr></thead><tbody>'+products.map(p=>'<tr><td class="td-strong">'+esc(p.title||p.name||'Unnamed product')+'</td><td>'+esc(p.category)+'</td><td>'+esc(p.variant)+'</td><td>'+money(p.price_inr??p.price)+'</td><td>'+Number(p.stock||0)+'</td><td>'+(p.is_published?'Yes':'No')+'</td></tr>').join('')+'</tbody></table></div>';
const wishlistSummary=()=>{const byProduct=new Map();wishlistLeads.forEach(w=>{const name=String(w.product_name||'Unknown product').trim()||'Unknown product';const item=byProduct.get(name)||{name,count:0,customers:new Set()};item.count++;if(w.phone)item.customers.add(String(w.phone).trim());byProduct.set(name,item)});const top=[...byProduct.values()].sort((a,b)=>b.count-a.count).slice(0,6);return top.length?'<div class="gp-wishlist-top-products">'+top.map((p,i)=>'<div class="gp-wishlist-product"><span class="gp-wishlist-rank">'+(i+1)+'</span><strong>'+esc(p.name)+'</strong><span>'+p.count+' '+(p.count===1?'like':'likes')+' · '+p.customers.size+' customers</span></div>').join('')+'</div>':'<p style="color:#8992a6">No wishlist interest recorded yet.</p>'};
const wishlistRows=(rows,editable)=>'<div class="table-wrap"><table class="data-table"><thead><tr>'+(editable?'<th><input type="checkbox" id="gp-wishlist-all" '+(rows.length&&rows.every(w=>wishlistSelected.has(String(w.id)))?'checked':'')+'></th>':'')+'<th>Date</th><th>Customer</th><th>Mobile</th><th>Product Liked</th><th>Action</th></tr></thead><tbody>'+(rows.length?rows.map(w=>'<tr>'+(editable?'<td><input type="checkbox" data-wishlist-select="'+esc(w.id)+'" '+(wishlistSelected.has(String(w.id))?'checked':'')+'></td>':'')+'<td>'+esc(w.created_at?new Date(w.created_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}):'—')+'</td><td>'+esc(w.customer_name||'—')+'</td><td>'+esc(w.phone||'—')+'</td><td class="td-strong">'+esc(w.product_name||'—')+'</td><td><div class="gp-wishlist-row-actions">'+(w.phone?'<a href="tel:'+encodeURIComponent(w.phone)+'">Call</a>':'')+(editable?'<button type="button" class="gp-wishlist-remove-one" data-wishlist-remove="'+esc(w.id)+'">Remove</button>':'')+'</div></td></tr>').join(''):'<tr><td colspan="'+(editable?'6':'5')+'">No wishlist leads yet.</td></tr>')+'</tbody></table></div>';
const loginRows=source=>{const list=loginEvents.filter(x=>x.source===source);return '<div class="table-wrap"><table class="data-table"><thead><tr><th>Date / Time</th><th>Customer Name</th><th>Mobile Number</th><th>Action</th></tr></thead><tbody>'+(list.length?list.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}))+'</td><td class="td-strong">'+esc(x.customer_name)+'</td><td>'+esc(x.phone)+'</td><td><button class="linkbtn" data-delete-login="'+esc(x.id)+'">Remove</button></td></tr>').join(''):'<tr><td colspan="4">No recorded logins</td></tr>')+'</tbody></table></div>'};
function render(){document.body.classList.remove('gp-boss-signin');const navItems=[['overview','Overview'],['orders','Orders'],['products','Products & Stock'],['customers','Customers'],['wishlist','Wishlist Leads'],['analytics','Analytics'],['settings','Settings']];nav.innerHTML=navItems.map(([id,title])=>'<button class="nav-btn '+(page===id?'active':'')+'" data-page="'+id+'">'+title+'</button>').join('');crumb.textContent=navItems.find(x=>x[0]===page)?.[1]||'Overview';const list=recent(),p=paid(),revenue=p.reduce((a,o)=>a+Number(o.total_amount||0),0);let content='';
if(page==='overview')content=heading('Business Overview','Live records from Galaxy Point Firebase')+'<div class="kpi-grid">'+kpi('Paid Orders',p.length)+kpi('Paid Revenue',money(revenue))+kpi('New Paid Orders',p.filter(o=>o.fulfillment_status==='New').length)+kpi('Products',products.length)+kpi('Customers',customers.length)+kpi('Wishlist Customers',new Set(wishlistLeads.map(w=>String(w.phone||'').replace(/\D/g,'').slice(-10)).filter(x=>x.length===10)).size)+'</div><section class="panel gp-wishlist-overview"><div class="panel-head"><div class="panel-title">Wishlist Interest · What customers like</div><button class="gp-wishlist-open" data-open-wishlist type="button">View All Leads →</button></div><div class="gp-wishlist-overview-stats"><span><b>'+new Set(wishlistLeads.map(w=>String(w.phone||'').replace(/\D/g,'').slice(-10)).filter(x=>x.length===10)).size+'</b> unique customers by mobile number</span></div>'+wishlistSummary()+'<div class="gp-wishlist-recent-title">Latest customer interest</div>'+wishlistRows(wishlistLeads.slice(0,5),false)+'</section><section class="panel"><div class="panel-head"><div class="panel-title">Recent Orders</div></div>'+orderRows(list.slice(0,10))+'</section>';
if(page==='orders')content=heading('Orders Management','Real orders and fulfillment status')+'<section class="panel">'+orderRows(list)+'</section>';
if(page==='products')content=heading('Product & Stock Overview','Inventory synchronized with the website editor')+'<section class="panel">'+productRows()+'</section>';
if(page==='customers')content=heading('Customers','Customer activity and order enquiries')+'<section class="panel"><div class="gp-customer-actions"><button class="gp-customer-refresh" id="gp-refresh-customers" type="button">↻ Refresh Customers</button><span class="gp-customer-refresh-status">Latest customer activity</span></div><div class="gp-customer-tabs"><button data-login-tab="mobile_login" class="'+(customerLoginTab==='mobile_login'?'active':'')+'"><span class="gp-customer-tab-title">Mobile Login</span><span class="gp-customer-tab-count">'+loginEvents.filter(x=>x.source==='mobile_login').length+'</span><span class="gp-customer-tab-desc">App customer registrations</span></button><button data-login-tab="website_login" class="'+(customerLoginTab==='website_login'?'active':'')+'"><span class="gp-customer-tab-title">Website Login</span><span class="gp-customer-tab-count">'+loginEvents.filter(x=>x.source==='website_login').length+'</span><span class="gp-customer-tab-desc">Cart & Buy Now customer logins</span></button></div><div class="gp-customer-record-heading">'+(customerLoginTab==='mobile_login'?'Mobile Login':'Website Login')+' · '+loginEvents.filter(x=>x.source===customerLoginTab).length+' records</div>'+loginRows(customerLoginTab)+'</section>';
if(page==='wishlist')content=heading('Wishlist Leads','See what customers liked and manage enquiries')+'<section class="panel"><div class="gp-wishlist-toolbar"><div><div class="panel-title">Customer Wishlist ('+wishlistLeads.length+')</div></div><div class="gp-wishlist-actions"><span id="gp-wishlist-selection-count">0 selected</span><button type="button" id="gp-wishlist-select-all" class="gp-wishlist-secondary">Select All</button><button type="button" id="gp-wishlist-remove-selected" class="gp-wishlist-danger" disabled>Remove Selected</button></div></div>'+wishlistRows(wishlistLeads,true)+'</section>';
if(page==='analytics')content=heading('Sales Analytics','Paid orders only')+'<div class="kpi-grid">'+kpi('Paid Revenue',money(revenue))+kpi('Paid Orders',p.length)+kpi('Average Order',money(p.length?revenue/p.length:0))+'</div><section class="panel"><div class="panel-title">Sales by source</div>'+(['Instagram','YouTube','WhatsApp','Facebook','Direct','Other'].map(src=>'<div class="source-row"><label>'+src+'</label><span>'+p.filter(o=>(o.customer_source||'Other')===src).length+' paid</span></div>').join(''))+'</section>';
if(page==='settings')content=heading('Dashboard Settings','Connected to Galaxy Point Firebase')+'<section class="panel"><p><a class="btn primary" href="editor.html">Open Website Editor</a></p><button class="btn" id="refresh">Refresh data</button> <button class="btn" id="logout">Sign out</button></section>';
root.innerHTML=content;root.querySelectorAll('[data-open-wishlist]').forEach(b=>b.onclick=()=>{page='wishlist';render()});
const updateWishlistSelection=()=>{const n=wishlistSelected.size,indicator=root.querySelector('#gp-wishlist-selection-count'),btn=root.querySelector('#gp-wishlist-remove-selected'),all=root.querySelector('#gp-wishlist-all');if(indicator)indicator.textContent=n+' selected';if(btn)btn.disabled=n===0;if(all)all.checked=wishlistLeads.length>0&&wishlistLeads.every(w=>wishlistSelected.has(String(w.id)))};
root.querySelectorAll('[data-wishlist-select]').forEach(b=>b.onchange=()=>{const id=String(b.dataset.wishlistSelect);if(b.checked)wishlistSelected.add(id);else wishlistSelected.delete(id);updateWishlistSelection()});
const allWishlist=root.querySelector('#gp-wishlist-all');if(allWishlist)allWishlist.onchange=()=>{wishlistSelected=allWishlist.checked?new Set(wishlistLeads.map(w=>String(w.id))):new Set();render()};
const selectWishlist=root.querySelector('#gp-wishlist-select-all');if(selectWishlist)selectWishlist.onclick=()=>{wishlistSelected=new Set(wishlistLeads.map(w=>String(w.id)));render()};
const removeWishlist=async ids=>{const valid=[...new Set(ids.map(String))].filter(id=>wishlistLeads.some(w=>String(w.id)===id));if(!valid.length)return;if(!confirm('Permanently remove '+valid.length+' wishlist lead(s)?'))return;root.querySelectorAll('.gp-wishlist-remove-one,#gp-wishlist-remove-selected').forEach(b=>b.disabled=true);try{for(const id of valid)await cloud.deleteDoc('wishlist_leads',id);wishlistSelected=new Set();await load()}catch(err){alert('Could not remove wishlist lead(s): '+err.message);render()}};
root.querySelectorAll('[data-wishlist-remove]').forEach(b=>b.onclick=()=>removeWishlist([b.dataset.wishlistRemove]));const removeSelected=root.querySelector('#gp-wishlist-remove-selected');if(removeSelected)removeSelected.onclick=()=>removeWishlist([...wishlistSelected]);updateWishlistSelection();
nav.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelector('#sidebar').classList.remove('mobile-open');document.querySelector('#mobileShade').classList.remove('show');render()});root.querySelectorAll('[data-delete-login]').forEach(b=>b.onclick=async()=>{const id=b.dataset.deleteLogin;const record=loginEvents.find(x=>String(x.id)===id);if(!record||!confirm('Remove login record for '+record.customer_name+'?'))return;b.disabled=true;try{await cloud.deleteDoc('customer_login_events',id);await load()}catch(e){alert('Could not remove: '+e.message);b.disabled=false}});if(root.querySelector('#gp-refresh-customers'))root.querySelector('#gp-refresh-customers').onclick=load;root.querySelectorAll('[data-login-tab]').forEach(b=>b.onclick=()=>{customerLoginTab=b.dataset.loginTab;render()});root.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=+b.dataset.period;render()});root.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>showOrder(b.dataset.order));if(root.querySelector('#refresh'))root.querySelector('#refresh').onclick=load;if(root.querySelector('#logout'))root.querySelector('#logout').onclick=async()=>{await cloud.signOut();login()};}
function showOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const allowed=['New','Processing','Packed','Shipped','Delivered'];const next=allowed[allowed.indexOf(o.fulfillment_status||'New')+1];const orderItems=items.filter(i=>i.order_id===id);const modal=document.querySelector('#modalRoot');modal.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div class="panel-title">Order '+esc(o.order_number||o.id)+'</div><button class="btn" id="closeOrder">Close</button></div><div class="modal-body"><p>Customer: '+esc(cname(o.customer_id).name||o.customer_name||'—')+'</p><p>Payment: '+esc(o.payment_status)+' · '+money(o.total_amount)+'</p><p>Fulfillment: '+esc(o.fulfillment_status||'New')+'</p>'+orderItems.map(i=>'<p>'+esc(i.product_name)+' '+esc(i.variant)+' × '+Number(i.quantity||0)+'</p>').join('')+'</div><div class="modal-foot">'+(o.payment_status==='Paid'&&next?'<button class="btn primary" id="advance">Mark '+next+'</button>':'')+'</div></div></div>';modal.querySelector('#closeOrder').onclick=()=>modal.innerHTML='';if(modal.querySelector('#advance'))modal.querySelector('#advance').onclick=async()=>{try{await cloud.patchDoc('orders',id,{fulfillment_status:next});modal.innerHTML='';await load();}catch(e){alert(e.message)}};}
(async()=>{try{const s=await cloud.ensureSession();if(s?.role==='boss'){await load();return;}}catch{}login()})();
})();
</script>
</body>
</html>
